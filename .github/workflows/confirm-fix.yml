name: Confirm Fix - Send Test Task
  on:
    workflow_dispatch:

  jobs:
    confirm-fix:
      runs-on: ubuntu-latest
      timeout-minutes: 5
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        CHAT_ID: "6317345496"
      steps:
        - name: Send test task to bot via curl
          run: |
            echo "=== Sending test task to Zypher bot ==="
            TASK="Zypher fix confirmation test: reply with just OK if you receive this."
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id=${CHAT_ID} \
              -d text="${TASK}"
            echo ""
            echo "=== Message sent ==="

        - name: Wait 30s for bot to process and reply
          run: |
            echo "Waiting 30 seconds for bot to process..."
            sleep 30

        - name: Fetch Telegram updates and check bot reply
          run: |
            echo "=== Fetching bot updates ==="
            UPDATES=$(curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getUpdates?limit=30")
            echo "$UPDATES" | python3 -c "
  import sys, json
  d = json.load(sys.stdin)
  results = d.get('result', [])
  print(f'Total updates: {len(results)}')
  print()
  for u in results[-8:]:
      m = u.get('message', {})
      if not m:
          continue
      sender = m.get('from', {}).get('username') or m.get('from', {}).get('first_name', 'unknown')
      chat = str(m.get('chat', {}).get('id', ''))
      text = m.get('text', '(no text)')[:300]
      print(f'  [{sender}@{chat}]: {text}')
  print()
  has_error = any('Something went wrong' in str(u) for u in results)
  print('ERROR MESSAGE DETECTED:', has_error)
  print('FIX STATUS:', 'FAIL - error still present' if has_error else 'PASS - no error detected')
            "
  