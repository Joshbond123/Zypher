name: Debug OpenClaw Gateway

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install OpenClaw
        run: npm install -g openclaw@2026.5.20 && openclaw --version 2>/dev/null || echo "installed"

      - name: Test Cerebras key directly
        env:
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_KEY_1 }}
        run: |
          echo "=== Cerebras key test ==="
          HTTP=$(curl -s -o /tmp/cb_resp.json -w "%{http_code}" \
            -H "Authorization: Bearer $CEREBRAS_API_KEY" \
            https://api.cerebras.ai/v1/models)
          echo "HTTP status: $HTTP"
          cat /tmp/cb_resp.json | python3 -c "
          import sys,json
          try:
            d=json.load(sys.stdin)
            if 'data' in d:
              print('Models:', [m['id'] for m in d['data']])
            else:
              print('Error response:', json.dumps(d))
          except: print(sys.stdin.read())
          " 2>/dev/null || cat /tmp/cb_resp.json

          echo "=== Quick inference test ==="
          curl -s -X POST https://api.cerebras.ai/v1/chat/completions \
            -H "Authorization: Bearer $CEREBRAS_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"model":"llama3.1-8b","messages":[{"role":"user","content":"Reply with just the word WORKING"}],"max_tokens":10}' \
            | python3 -c "
          import sys,json
          try:
            d=json.load(sys.stdin)
            if d.get('choices'):
              print('INFERENCE OK:', d['choices'][0]['message']['content'])
            else:
              print('INFERENCE FAIL:', json.dumps(d))
          except Exception as e: print('Parse error:', e, sys.stdin.read()[:200])
          " 2>/dev/null

      - name: Dump onboard-generated default config
        env:
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_KEY_1 }}
        run: |
          echo "=== Running openclaw onboard to see default config structure ==="
          openclaw onboard \
            --non-interactive \
            --mode local \
            --auth-choice cerebras-api-key \
            --cerebras-api-key "$CEREBRAS_API_KEY" \
            --accept-risk \
            --skip-health \
            --skip-bootstrap \
            2>&1 || true

          echo "=== openclaw onboard generated config (structure only, keys masked) ==="
          python3 -c "
          import json, re, os
          f = os.path.expanduser('~/.openclaw/openclaw.json')
          if os.path.exists(f):
              raw = open(f).read()
              masked = re.sub(r'\"(apiKey|botToken|key|token)\"\s*:\s*\"[^\"]{4,}\"', '\"\\\\1\": \"***\"', raw)
              print(masked)
          else:
              print('FILE NOT FOUND:', f)
          "

          echo ""
          echo "=== openclaw gateway help ==="
          openclaw gateway --help 2>&1 || true

          echo ""
          echo "=== openclaw configure --section agents --help (if exists) ==="
          openclaw configure --help 2>&1 || true

      - name: Test gateway with onboard-default config (90s)
        env:
          TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CEREBRAS_API_KEY:     ${{ secrets.CEREBRAS_KEY_1 }}
          TAVILY_API_KEY:       ${{ secrets.TAVILY_KEY_1 }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          # Inject just the telegram token + cerebras key into the onboard-generated config
          # This uses the minimal config the onboard step already wrote
          python3 -c "
          import json, os
          f = os.path.expanduser('~/.openclaw/openclaw.json')
          c = json.load(open(f))
          print('TOP-LEVEL KEYS:', list(c.keys()))
          print('agents keys:', list(c.get('agents', {}).keys()))
          print('agents.defaults keys:', list(c.get('agents', {}).get('defaults', {}).keys()))
          print('gateway keys:', list(c.get('gateway', {}).keys()))
          print('channels keys:', list(c.get('channels', {}).keys()))
          print('models keys:', list(c.get('models', {}).keys()))
          "

          echo "=== Start gateway (90s verbose) ==="
          timeout 90 openclaw gateway --verbose 2>&1 | tee /tmp/gw_debug.log || true

          echo ""
          echo "=== FULL GATEWAY LOG ==="
          cat /tmp/gw_debug.log

          echo ""
          echo "=== ERROR/WARNING LINES ==="
          grep -iE "error|fatal|fail|wrong|invalid|unrecog|warn" /tmp/gw_debug.log || echo "(no error lines)"
