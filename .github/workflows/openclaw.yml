name: Zypher OpenClaw Agent

on:
  workflow_dispatch:
    inputs:
      instance_number:
        description: 'Instance number for tracking'
        required: false
        default: '1'
  schedule:
    - cron: '0 */4 * * *'

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 235

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install security tools (Kali-style)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            nmap nikto sqlmap gobuster \
            hydra netcat-openbsd masscan \
            curl wget git jq \
            openssl net-tools whois dnsutils \
            dirb wfuzz wordlists \
            python3-pip python3-scapy \
            2>/dev/null || true
          echo "✓ Security tools installed"

      - name: Install OpenClaw (real framework)
        run: |
          npm install -g openclaw
          echo "✓ OpenClaw $(openclaw --version 2>/dev/null || echo 'installed') ready"

      - name: Run non-interactive OpenClaw onboard with Cerebras
        env:
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_KEY_1 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          openclaw onboard \
            --non-interactive \
            --mode local \
            --auth-choice cerebras-api-key \
            --cerebras-api-key "$CEREBRAS_API_KEY" \
            --accept-risk \
            --skip-bootstrap
          echo "✓ OpenClaw onboarded with Cerebras"

      - name: Write openclaw.json (Zypher config)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TAVILY_KEY_1: ${{ secrets.TAVILY_KEY_1 }}
          TAVILY_KEY_2: ${{ secrets.TAVILY_KEY_2 }}
          CEREBRAS_KEY_1: ${{ secrets.CEREBRAS_KEY_1 }}
          CEREBRAS_KEY_2: ${{ secrets.CEREBRAS_KEY_2 }}
          CEREBRAS_KEY_3: ${{ secrets.CEREBRAS_KEY_3 }}
          CEREBRAS_KEY_4: ${{ secrets.CEREBRAS_KEY_4 }}
          CEREBRAS_KEY_5: ${{ secrets.CEREBRAS_KEY_5 }}
        run: |
          mkdir -p ~/.openclaw/workspace

          # Copy project AGENTS.md as workspace identity
          cp AGENTS.md ~/.openclaw/workspace/AGENTS.md

          # Write the main OpenClaw config
          cat > ~/.openclaw/openclaw.json << 'EOF'
          {
            "agents": {
              "defaults": {
                "workspace": "~/.openclaw/workspace",
                "model": {
                  "primary": "cerebras/qwen-3-235b-a22b-instruct-2507"
                }
              },
              "list": [
                {
                  "id": "zypher",
                  "identity": {
                    "name": "Zypher",
                    "theme": "elite AI hacker and security researcher",
                    "emoji": "👾"
                  }
                }
              ]
            },
            "channels": {
              "telegram": {
                "enabled": true,
                "dmPolicy": "allowlist",
                "allowFrom": ["6317345496"]
              }
            },
            "tools": {
              "profile": "full",
              "exec": {
                "timeoutSec": 120,
                "security": "full"
              },
              "web": {
                "search": {
                  "provider": "tavily"
                }
              }
            },
            "plugins": {
              "entries": {
                "tavily": {
                  "enabled": true
                }
              }
            },
            "logging": {
              "level": "info",
              "file": "/tmp/openclaw.log",
              "consoleLevel": "info",
              "consoleStyle": "pretty"
            }
          }
          EOF

          # Pre-approve exec in headless mode (no prompts)
          cat > ~/.openclaw/exec-approvals.json << 'EOF'
          {
            "security": "full",
            "ask": "off"
          }
          EOF

          echo "✓ openclaw.json configured"
          echo "✓ exec-approvals.json set to full/off"

      - name: Register session in Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          INSTANCE_NUMBER: ${{ github.event.inputs.instance_number || '1' }}
        run: |
          EXPIRES=$(date -u -d '+4 hours' '+%Y-%m-%dT%H:%M:%SZ' 2>/dev/null || \
                    date -u '+%Y-%m-%dT%H:%M:%SZ')
          curl -s -X POST "$SUPABASE_URL/rest/v1/active_sessions" \
            -H "apikey: $SUPABASE_SERVICE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "{
              \"github_run_id\": \"$GITHUB_RUN_ID\",
              \"workflow_name\": \"openclaw.yml\",
              \"instance_number\": $INSTANCE_NUMBER,
              \"is_active\": true,
              \"expires_at\": \"$EXPIRES\"
            }" && echo "✓ Session registered" || echo "⚠ Session registration skipped"

      - name: Start OpenClaw Gateway (Zypher is live)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_KEY_1 }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_KEY_1 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          GITHUB_REPO: ${{ github.repository }}
          INSTANCE_NUMBER: ${{ github.event.inputs.instance_number || '1' }}
        run: |
          echo "🚀 Starting OpenClaw gateway..."

          # Export env vars so OpenClaw can resolve them
          export TELEGRAM_BOT_TOKEN CEREBRAS_API_KEY TAVILY_API_KEY

          # Start the gateway in background
          openclaw gateway 2>&1 | tee /tmp/openclaw.log &
          GATEWAY_PID=$!
          echo "Gateway PID: $GATEWAY_PID"

          # Wait for gateway to boot
          sleep 15
          echo ""
          echo "=== OpenClaw Status ==="
          openclaw status 2>/dev/null || ps aux | grep openclaw | grep -v grep
          echo ""
          echo "✅ Zypher (OpenClaw + Cerebras) is live on Telegram"
          echo "📱 Bot: @Zypher0_bot | Instance #${INSTANCE_NUMBER} | Run: $GITHUB_RUN_ID"

          # Run for 3h 40m then rotate
          sleep 13200

          echo ""
          echo "⏰ Rotation time — triggering instance #$(( INSTANCE_NUMBER + 1 ))..."
          NEXT=$(( INSTANCE_NUMBER + 1 ))
          curl -s -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/$GITHUB_REPO/actions/workflows/openclaw.yml/dispatches" \
            -d "{\"ref\":\"main\",\"inputs\":{\"instance_number\":\"$NEXT\"}}" && \
            echo "✓ Instance #$NEXT triggered" || echo "⚠ Rotation trigger failed"

          sleep 120

          # Mark session done
          curl -s -X PATCH \
            "$SUPABASE_URL/rest/v1/active_sessions?github_run_id=eq.$GITHUB_RUN_ID" \
            -H "apikey: $SUPABASE_SERVICE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            -H "Content-Type: application/json" \
            -d '{"is_active": false}' && echo "✓ Session closed" || true

          kill -TERM $GATEWAY_PID 2>/dev/null || true
          wait $GATEWAY_PID 2>/dev/null || true
          echo "✓ OpenClaw stopped cleanly"
