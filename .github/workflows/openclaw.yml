name: Zypher OpenClaw Agent

  on:
    workflow_dispatch:
      inputs:
        instance_number:
          description: 'Instance number for tracking'
          required: false
          default: '1'
    schedule:
      - cron: '0 */4 * * *'

  jobs:
    run-agent:
      runs-on: ubuntu-latest
      timeout-minutes: 235

      steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Setup Node.js 24
          uses: actions/setup-node@v4
          with:
            node-version: '24'

        - name: Setup Python 3
          uses: actions/setup-python@v5
          with:
            python-version: '3.11'

        - name: Install security tools + Google Chrome
          run: |
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends \
              nmap nikto sqlmap gobuster \
              hydra netcat-openbsd masscan \
              curl wget git jq \
              openssl net-tools whois dnsutils \
              dirb wfuzz wordlists \
              python3-pip python3-scapy \
              2>/dev/null || true

            # Install real Google Chrome .deb (NOT snap — required for OpenClaw browser tool)
            wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb -O /tmp/chrome.deb
            sudo apt-get install -y /tmp/chrome.deb 2>/dev/null || \
              (sudo dpkg -i /tmp/chrome.deb; sudo apt-get install -f -y 2>/dev/null) || true
            echo "✓ Security tools installed"
            echo "✓ Chrome: $(google-chrome --version 2>/dev/null || echo 'check above')"

        - name: Install OpenClaw
          run: |
            npm install -g openclaw
            echo "✓ OpenClaw $(openclaw --version 2>/dev/null || echo installed) ready"

        - name: Run non-interactive OpenClaw onboard with Cerebras
          env:
            CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_KEY_1 }}
            TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          run: |
            openclaw onboard \
              --non-interactive \
              --mode local \
              --auth-choice cerebras-api-key \
              --cerebras-api-key "$CEREBRAS_API_KEY" \
              --accept-risk \
              --skip-health \
              --skip-bootstrap
            echo "✓ OpenClaw onboarded with Cerebras"

        - name: Bootstrap persistent memory from Supabase
          env:
            SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
            SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
            GITHUB_RUN_ID: ${{ github.run_id }}
          run: |
            mkdir -p ~/.openclaw/workspace

            # Pull last 30 messages for session context
            MSGS=$(curl -s \
              "$SUPABASE_URL/rest/v1/chat_messages?order=created_at.desc&limit=30&select=role,content,created_at" \
              -H "apikey: $SUPABASE_SERVICE_KEY" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" 2>/dev/null || echo "[]")

            # Pull long-term facts
            FACTS=$(curl -s \
              "$SUPABASE_URL/rest/v1/longterm_memory?order=created_at.desc&limit=20&select=key,value" \
              -H "apikey: $SUPABASE_SERVICE_KEY" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" 2>/dev/null || echo "[]")

            python3 - <<PYEOF
  import json, os, sys
  msgs_raw  = os.environ.get("MSGS_JSON","[]")
  facts_raw = os.environ.get("FACTS_JSON","[]")
  run_id    = os.environ.get("GITHUB_RUN_ID","unknown")

  try:    msgs  = json.loads("""$MSGS""")
  except: msgs  = []
  try:    facts = json.loads("""$FACTS""")
  except: facts = []

  msgs.reverse()

  lines = [
    f"# Zypher Session Memory",
    f"# Restored from Supabase | Run: {run_id}",
    "",
    "## Long-term Facts",
  ]
  if facts:
    for f in facts:
      lines.append(f"- **{f.get('key','?')}**: {f.get('value','')[:300]}")
  else:
    lines.append("(none yet — facts accumulate as you work)")

  lines += ["", "## Recent Conversation History"]
  if msgs:
    for m in msgs:
      role    = m.get("role","?").upper()
      content = m.get("content","")[:400]
      ts      = m.get("created_at","")[:16]
      lines.append(f"[{ts}] **{role}**: {content}")
  else:
    lines.append("(no history yet — first session)")

  with open(os.path.expanduser("~/.openclaw/workspace/MEMORY.md"),"w") as fh:
    fh.write("
".join(lines))
  print(f"MEMORY.md written: {len(msgs)} messages, {len(facts)} facts")
  PYEOF
            echo "✓ Supabase memory bootstrapped"

        - name: Write openclaw.json (Zypher v2 config)
          env:
            TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
            TAVILY_KEY_1: ${{ secrets.TAVILY_KEY_1 }}
            CEREBRAS_KEY_1: ${{ secrets.CEREBRAS_KEY_1 }}
          run: |
            mkdir -p ~/.openclaw/workspace
            cp AGENTS.md ~/.openclaw/workspace/AGENTS.md

            cat > ~/.openclaw/openclaw.json << 'OCEOF'
            {
              "agents": {
                "defaults": {
                  "workspace": "~/.openclaw/workspace",
                  "model": {
                    "primary": "cerebras/qwen-3-235b-a22b-instruct-2507"
                  }
                },
                "list": [
                  {
                    "id": "zypher",
                    "identity": {
                      "name": "Zypher",
                      "theme": "elite AI hacker and security researcher",
                      "emoji": "👾"
                    }
                  }
                ]
              },
              "channels": {
                "telegram": {
                  "enabled": true,
                  "dmPolicy": "allowlist",
                  "allowFrom": ["6317345496"]
                }
              },
              "tools": {
                "profile": "full",
                "exec": {
                  "timeoutSec": 120,
                  "security": "full"
                },
                "web": {
                  "search": { "provider": "tavily" },
                  "fetch":  { "enabled": true, "maxChars": 50000 }
                }
              },
              "browser": {
                "enabled": true,
                "headless": true,
                "profiles": {
                  "openclaw": { "headless": true }
                }
              },
              "plugins": {
                "entries": {
                  "tavily":  { "enabled": true },
                  "browser": { "enabled": true }
                }
              },
              "logging": {
                "level": "info",
                "file": "/tmp/openclaw.log",
                "consoleLevel": "info",
                "consoleStyle": "pretty"
              }
            }
            OCEOF

            cat > ~/.openclaw/exec-approvals.json << 'EAEOF'
            { "security": "full", "ask": "off" }
            EAEOF

            echo "✓ openclaw.json written — browser + web_fetch + Tavily + full exec"

        - name: Register session in Supabase
          env:
            SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
            SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
            GITHUB_RUN_ID: ${{ github.run_id }}
            INSTANCE_NUMBER: ${{ github.event.inputs.instance_number || '1' }}
          run: |
            EXPIRES=$(date -u -d '+4 hours' '+%Y-%m-%dT%H:%M:%SZ' 2>/dev/null || date -u '+%Y-%m-%dT%H:%M:%SZ')
            curl -s -X POST "$SUPABASE_URL/rest/v1/active_sessions" \
              -H "apikey: $SUPABASE_SERVICE_KEY" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
              -H "Content-Type: application/json" \
              -H "Prefer: return=minimal" \
              -d "{\"github_run_id\":\"$GITHUB_RUN_ID\",\"workflow_name\":\"openclaw.yml\",\"instance_number\":$INSTANCE_NUMBER,\"is_active\":true,\"expires_at\":\"$EXPIRES\"}" \
              && echo "✓ Session registered" || echo "⚠ Session skipped"

        - name: Start Supabase bridge sidecar
          env:
            SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
            SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
            GITHUB_RUN_ID: ${{ github.run_id }}
          run: |
            python3 scripts/zypher_agent.py > /tmp/sidecar.log 2>&1 &
            echo "✓ Supabase bridge started (PID $!)"

        - name: Start OpenClaw Gateway — Zypher is live
          env:
            TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
            CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_KEY_1 }}
            TAVILY_API_KEY: ${{ secrets.TAVILY_KEY_1 }}
            SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
            SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
            GITHUB_RUN_ID: ${{ github.run_id }}
            GITHUB_TOKEN: ${{ secrets.GH_PAT }}
            GITHUB_REPO: ${{ github.repository }}
            INSTANCE_NUMBER: ${{ github.event.inputs.instance_number || '1' }}
          run: |
            echo "🚀 Starting Zypher v2 (OpenClaw + Supabase + Browser)..."
            export TELEGRAM_BOT_TOKEN CEREBRAS_API_KEY TAVILY_API_KEY SUPABASE_URL SUPABASE_SERVICE_KEY GITHUB_RUN_ID

            openclaw gateway 2>&1 | tee /tmp/openclaw.log &
            GATEWAY_PID=$!
            echo "Gateway PID: $GATEWAY_PID"

            sleep 15
            echo "=== Zypher Status ==="
            openclaw status 2>/dev/null || ps aux | grep openclaw | grep -v grep
            echo "✅ @Zypher0_bot | Instance #${INSTANCE_NUMBER} | Run: $GITHUB_RUN_ID"

            # 3h 40m runtime then rotate
            sleep 13200

            NEXT=$(( INSTANCE_NUMBER + 1 ))
            echo "⏰ Rotating to instance #$NEXT..."
            curl -s -X POST \
              -H "Authorization: token $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/$GITHUB_REPO/actions/workflows/openclaw.yml/dispatches" \
              -d "{\"ref\":\"main\",\"inputs\":{\"instance_number\":\"$NEXT\"}}" \
              && echo "✓ Instance #$NEXT triggered" || echo "⚠ Rotation failed"

            sleep 120
            curl -s -X PATCH "$SUPABASE_URL/rest/v1/active_sessions?github_run_id=eq.$GITHUB_RUN_ID" \
              -H "apikey: $SUPABASE_SERVICE_KEY" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
              -H "Content-Type: application/json" \
              -d '{"is_active":false}' && echo "✓ Session closed" || true

            kill -TERM $GATEWAY_PID 2>/dev/null || true
            wait $GATEWAY_PID 2>/dev/null || true
            echo "✓ Gateway stopped"
  