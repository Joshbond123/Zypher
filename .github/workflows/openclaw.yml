name: Zypher OpenClaw Agent

on:
  workflow_dispatch:
    inputs:
      instance_number:
        description: 'Instance number for tracking'
        required: false
        default: '1'
  schedule:
    - cron: '0 */4 * * *'

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 235

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Kali Linux tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            nmap nikto sqlmap gobuster \
            curl wget git jq \
            openssl net-tools whois dnsutils 2>/dev/null || true
          echo "✓ Tools installed"

      - name: Install OpenClaw via npm
        run: |
          npm install -g openclaw 2>/dev/null || true
          echo "✓ OpenClaw install attempted"

      - name: Install ClawHub skills
        run: |
          npx openclaw plugins install clawhub:stealth-browser 2>/dev/null || true
          npx openclaw plugins install clawhub:tavily 2>/dev/null || true
          echo "✓ Skills install attempted"

      - name: Configure OpenClaw Supabase plugin
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          mkdir -p ~/.openclaw/plugins/supabase
          cat > ~/.openclaw/config.json << CONF
          {
            "agent": {"name": "Zypher", "system_prompt_file": "AGENTS.md"},
            "supabase": {
              "url": "$SUPABASE_URL",
              "key": "$SUPABASE_SERVICE_KEY",
              "tables": {
                "sessions": "active_sessions",
                "messages": "chat_messages",
                "users": "profiles",
                "telegram": "telegram_connections",
                "api_keys": "cerebras_keys"
              }
            }
          }
          CONF
          cat > ~/.openclaw/plugins/supabase/config.json << SCONF
          {
            "url": "$SUPABASE_URL",
            "key": "$SUPABASE_SERVICE_KEY",
            "schema": "public"
          }
          SCONF
          echo "✓ Supabase plugin configured"

      - name: Install Python agent dependencies
        run: |
          pip install -q \
            "python-telegram-bot==20.7" \
            "cerebras-cloud-sdk" \
            "tavily-python" \
            "supabase" \
            "httpx" \
            "requests" 2>/dev/null || \
          pip install -q \
            "python-telegram-bot" \
            "supabase" \
            "httpx" \
            "requests" 2>/dev/null || true
          echo "✓ Python deps installed"

      - name: Register session in Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          INSTANCE_NUMBER: ${{ github.event.inputs.instance_number || '1' }}
        run: |
          EXPIRES=$(date -u -d '+4 hours' '+%Y-%m-%dT%H:%M:%SZ' 2>/dev/null || date -u '+%Y-%m-%dT%H:%M:%SZ')
          curl -s -X POST "$SUPABASE_URL/rest/v1/active_sessions" \
            -H "apikey: $SUPABASE_SERVICE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "{
              \"github_run_id\": \"$GITHUB_RUN_ID\",
              \"workflow_name\": \"openclaw.yml\",
              \"instance_number\": $INSTANCE_NUMBER,
              \"is_active\": true,
              \"expires_at\": \"$EXPIRES\"
            }" && echo "✓ Session registered" || echo "⚠ Session registration failed (non-critical)"

      - name: Start Zypher Agent
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          CEREBRAS_KEY_1: ${{ secrets.CEREBRAS_KEY_1 }}
          CEREBRAS_KEY_2: ${{ secrets.CEREBRAS_KEY_2 }}
          CEREBRAS_KEY_3: ${{ secrets.CEREBRAS_KEY_3 }}
          CEREBRAS_KEY_4: ${{ secrets.CEREBRAS_KEY_4 }}
          CEREBRAS_KEY_5: ${{ secrets.CEREBRAS_KEY_5 }}
          TAVILY_KEY_1: ${{ secrets.TAVILY_KEY_1 }}
          TAVILY_KEY_2: ${{ secrets.TAVILY_KEY_2 }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          GITHUB_REPO: ${{ github.repository }}
          INSTANCE_NUMBER: ${{ github.event.inputs.instance_number || '1' }}
        run: |
          echo "🚀 Starting Zypher agent..."
          python3 scripts/zypher_agent.py &
          AGENT_PID=$!
          echo "Agent PID: $AGENT_PID"

          # Run for 3h40m then gracefully rotate
          sleep 13200

          echo "⏰ Rotation time — triggering new instance..."
          NEXT=$(( ${INSTANCE_NUMBER} + 1 ))
          curl -s -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/$GITHUB_REPO/actions/workflows/openclaw.yml/dispatches" \
            -d "{\"ref\":\"main\",\"inputs\":{\"instance_number\":\"$NEXT\"}}" && \
            echo "✓ New instance triggered (#$NEXT)" || echo "⚠ Rotation trigger failed"

          sleep 120

          # Mark session done
          curl -s -X PATCH "$SUPABASE_URL/rest/v1/active_sessions?github_run_id=eq.$GITHUB_RUN_ID" \
            -H "apikey: $SUPABASE_SERVICE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            -H "Content-Type: application/json" \
            -d '{"is_active": false}' && echo "✓ Session marked done" || true

          kill -TERM $AGENT_PID 2>/dev/null || true
          wait $AGENT_PID 2>/dev/null || true
          echo "✓ Agent stopped cleanly"
