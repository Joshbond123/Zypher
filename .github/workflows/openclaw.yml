name: Zypher OpenClaw Agent

on:
  workflow_dispatch:
    inputs:
      instance_number:
        description: 'Instance number for tracking'
        required: false
        default: '1'
  schedule:
    - cron: '0 */4 * * *'

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 235

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install security tools + Google Chrome
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            nmap nikto sqlmap gobuster \
            hydra netcat-openbsd masscan \
            curl wget git jq \
            openssl net-tools whois dnsutils \
            dirb wfuzz wordlists \
            python3-pip python3-scapy \
            2>/dev/null || true
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb -O /tmp/chrome.deb
          sudo apt-get install -y /tmp/chrome.deb 2>/dev/null \
            || (sudo dpkg -i /tmp/chrome.deb && sudo apt-get -f install -y) || true
          echo "Tools ready | Chrome: $(google-chrome --version 2>/dev/null || echo not-found)"

      - name: Validate secrets are present
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CEREBRAS_API_KEY:   ${{ secrets.CEREBRAS_KEY_1 }}
          SUPABASE_URL:       ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          MISSING=0
          [ -z "$TELEGRAM_BOT_TOKEN" ]   && echo "ERROR: TELEGRAM_BOT_TOKEN secret is not set" && MISSING=1
          [ -z "$CEREBRAS_API_KEY" ]     && echo "ERROR: CEREBRAS_KEY_1 secret is not set"     && MISSING=1
          [ -z "$SUPABASE_URL" ]         && echo "WARN:  SUPABASE_URL secret is not set (memory disabled)"
          [ -z "$SUPABASE_SERVICE_KEY" ] && echo "WARN:  SUPABASE_SERVICE_KEY secret is not set (memory disabled)"
          [ "$MISSING" = "1" ] && exit 1 || echo "Required secrets present"

      - name: Validate Telegram bot token
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          RESPONSE=$(curl -sf "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getMe" 2>&1)
          if echo "$RESPONSE" | grep -q '"ok":true'; then
            BOT_NAME=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['result'].get('username','?'))")
            echo "Telegram token valid — bot: @${BOT_NAME}"
          else
            echo "ERROR: Telegram token is invalid or unreachable"
            echo "Response: $RESPONSE"
            exit 1
          fi

      - name: Install OpenClaw
        run: |
          npm install -g openclaw
          echo "OpenClaw $(openclaw --version 2>/dev/null || echo installed)"

      - name: OpenClaw onboard (Cerebras)
        env:
          CEREBRAS_API_KEY:   ${{ secrets.CEREBRAS_KEY_1 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          # Run onboard first so it initialises directories and writes gateway.mode=local.
          # The next step overwrites openclaw.json with our full template, so onboard's
          # partial config is intentionally replaced — gateway.mode is added to the template.
          openclaw onboard \
            --non-interactive \
            --mode local \
            --auth-choice cerebras-api-key \
            --cerebras-api-key "$CEREBRAS_API_KEY" \
            --accept-risk \
            --skip-health \
            --skip-bootstrap \
            2>&1 || true
          echo "Onboard complete — gateway.mode initialised"

      - name: Write openclaw.json from template
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TAVILY_API_KEY:      ${{ secrets.TAVILY_KEY_1 }}
          CEREBRAS_API_KEY:    ${{ secrets.CEREBRAS_KEY_1 }}
        run: |
          mkdir -p ~/.openclaw/workspace
          cp AGENTS.md ~/.openclaw/workspace/AGENTS.md
          # Substitute all three secrets as literal values so openclaw never
          # needs to resolve env-var placeholders — avoids "Missing env var" errors
          sed \
            -e "s|TAVILY_KEY_HERE|${TAVILY_API_KEY}|g" \
            -e "s|TELEGRAM_TOKEN_HERE|${TELEGRAM_BOT_TOKEN}|g" \
            -e "s|CEREBRAS_KEY_HERE|${CEREBRAS_API_KEY}|g" \
            scripts/oc_template.json > ~/.openclaw/openclaw.json
          echo '{ "security": "full", "ask": "off" }' > ~/.openclaw/exec-approvals.json
          echo "openclaw.json written — all tokens injected (Telegram, Tavily, Cerebras, gateway.mode=local)"
          # Sanity: confirm no placeholder survived
          if grep -qE "TELEGRAM_TOKEN_HERE|TAVILY_KEY_HERE|CEREBRAS_KEY_HERE" ~/.openclaw/openclaw.json; then
            echo "ERROR: Template placeholders were not substituted"
            exit 1
          fi
          # Sanity: confirm gateway.mode is present
          if ! python3 -c "import json; c=json.load(open('$HOME/.openclaw/openclaw.json')); assert c.get('gateway',{}).get('mode')=='local', 'gateway.mode missing'"; then
            echo "ERROR: gateway.mode=local missing from openclaw.json"
            exit 1
          fi
          # Sanity: confirm browser.profiles.openclaw.color is a string
          python3 -c "
          import json, sys
          c = json.load(open('$HOME/.openclaw/openclaw.json'))
          color = c.get('browser',{}).get('profiles',{}).get('openclaw',{}).get('color','')
          if not isinstance(color, str) or not color:
              print('ERROR: browser.profiles.openclaw.color is missing or not a string')
              sys.exit(1)
          print(f'browser.profiles.openclaw.color = {color!r}  OK')
          "
          echo "All template sanity checks passed"

      - name: Install stealth-browser + Tavily from ClawHub
        run: |
          echo "--- stealth-browser ---"
          openclaw skills install clawhub:stealth-browser 2>&1 \
            || openclaw plugins install clawhub:stealth-browser 2>&1 \
            || echo "stealth-browser bundled fallback active"
          echo "--- tavily ---"
          openclaw skills install clawhub:tavily 2>&1 \
            || openclaw plugins install npm:@openclaw/tavily 2>&1 \
            || echo "tavily API-key config will be used"
          echo "--- plugin list ---"
          openclaw plugins list 2>/dev/null || true
          openclaw skills list  2>/dev/null || true

      - name: Bootstrap memory from Supabase
        env:
          SUPABASE_URL:        ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GITHUB_RUN_ID:       ${{ github.run_id }}
        run: |
          mkdir -p ~/.openclaw/workspace
          echo "[]" > /tmp/sb_msgs.json
          echo "[]" > /tmp/sb_facts.json
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_SERVICE_KEY" ]; then
            curl -sf "$SUPABASE_URL/rest/v1/chat_messages?order=created_at.desc&limit=30&select=role,content,created_at" \
              -H "apikey: $SUPABASE_SERVICE_KEY" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
              -o /tmp/sb_msgs.json \
              && echo "Chat messages fetched" \
              || { echo "WARN: could not fetch chat_messages"; echo "[]" > /tmp/sb_msgs.json; }
            curl -sf "$SUPABASE_URL/rest/v1/longterm_memory?order=created_at.desc&limit=20&select=key,value" \
              -H "apikey: $SUPABASE_SERVICE_KEY" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
              -o /tmp/sb_facts.json \
              && echo "Long-term facts fetched" \
              || { echo "WARN: could not fetch longterm_memory"; echo "[]" > /tmp/sb_facts.json; }
          else
            echo "Supabase not configured — starting fresh session"
          fi
          python3 scripts/bootstrap_memory.py \
            --msgs  /tmp/sb_msgs.json \
            --facts /tmp/sb_facts.json \
            --run-id "$GITHUB_RUN_ID" \
            --out   ~/.openclaw/workspace/MEMORY.md \
            && echo "Memory bootstrapped from Supabase" \
            || { echo "Bootstrap error — using blank memory"; \
                 printf "# Zypher Memory\nFresh session — no history yet\n" \
                   > ~/.openclaw/workspace/MEMORY.md; }

      - name: Register session in Supabase
        env:
          SUPABASE_URL:        ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GITHUB_RUN_ID:       ${{ github.run_id }}
          INSTANCE_NUMBER:     ${{ github.event.inputs.instance_number || '1' }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_KEY" ]; then
            echo "Supabase not configured — skipping session registration"
            exit 0
          fi
          EXPIRES=$(date -u -d '+4 hours' '+%Y-%m-%dT%H:%M:%SZ' 2>/dev/null \
            || date -u '+%Y-%m-%dT%H:%M:%SZ')
          curl -s -X POST "$SUPABASE_URL/rest/v1/active_sessions" \
            -H "apikey: $SUPABASE_SERVICE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "{\"github_run_id\":\"$GITHUB_RUN_ID\",\"workflow_name\":\"openclaw.yml\",\"instance_number\":$INSTANCE_NUMBER,\"is_active\":true,\"expires_at\":\"$EXPIRES\"}" \
            && echo "Session registered (run=$GITHUB_RUN_ID instance=#$INSTANCE_NUMBER)" \
            || echo "WARN: Session registration failed (non-fatal)"

      - name: Start Supabase bridge sidecar
        env:
          SUPABASE_URL:        ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GITHUB_RUN_ID:       ${{ github.run_id }}
        run: |
          # Validate the sidecar script parses cleanly before launching
          python3 -m py_compile scripts/zypher_agent.py \
            && echo "Sidecar syntax OK" \
            || { echo "ERROR: zypher_agent.py has a syntax error — aborting"; exit 1; }
          python3 scripts/zypher_agent.py > /tmp/sidecar.log 2>&1 &
          SIDECAR_PID=$!
          echo "Supabase sidecar PID $SIDECAR_PID"
          # Give it 3 seconds to ensure it didn't crash immediately
          sleep 3
          if ! kill -0 $SIDECAR_PID 2>/dev/null; then
            echo "ERROR: Sidecar crashed immediately. Last log:"
            cat /tmp/sidecar.log
            exit 1
          fi
          echo "Sidecar is running"

      - name: Start OpenClaw Gateway
        env:
          TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CEREBRAS_API_KEY:     ${{ secrets.CEREBRAS_KEY_1 }}
          CEREBRAS_API_KEY_2:   ${{ secrets.CEREBRAS_KEY_2 }}
          CEREBRAS_API_KEY_3:   ${{ secrets.CEREBRAS_KEY_3 }}
          CEREBRAS_API_KEY_4:   ${{ secrets.CEREBRAS_KEY_4 }}
          CEREBRAS_API_KEY_5:   ${{ secrets.CEREBRAS_KEY_5 }}
          TAVILY_API_KEY:       ${{ secrets.TAVILY_KEY_1 }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GITHUB_RUN_ID:        ${{ github.run_id }}
          GITHUB_TOKEN:         ${{ secrets.GH_PAT }}
          GITHUB_REPO:          ${{ github.repository }}
          INSTANCE_NUMBER:      ${{ github.event.inputs.instance_number || '1' }}
        run: |
          echo "=== Pre-flight: openclaw.json channels block ==="
          python3 -c "
          import json, sys
          try:
              cfg = json.load(open(f'{__import__(\"os\").path.expanduser(\"~\")}/.openclaw/openclaw.json'))
              tg = cfg.get('channels', {}).get('telegram', {})
              has_token = bool(tg.get('botToken', ''))
              print(f'  enabled={tg.get(\"enabled\")}  dmPolicy={tg.get(\"dmPolicy\")}  botToken_set={has_token}  allowFrom={tg.get(\"allowFrom\")}')
              if not has_token:
                  print('ERROR: botToken is missing from openclaw.json — bot will not respond')
                  sys.exit(1)
          except Exception as e:
              print(f'Could not validate config: {e}')
          "

          echo "Starting Zypher — stealth-browser + Tavily + Supabase memory..."
          openclaw gateway 2>&1 | tee /tmp/openclaw.log &
          GATEWAY_PID=$!

          echo "Gateway PID $GATEWAY_PID — waiting 20 s for startup..."
          sleep 20

          echo "=== Gateway startup status ==="
          openclaw status 2>/dev/null || ps aux | grep openclaw | grep -v grep || echo "openclaw process not in ps"

          echo "=== First 60 log lines ==="
          head -60 /tmp/openclaw.log 2>/dev/null || echo "(log empty)"

          # Fail fast if the gateway already died
          if ! kill -0 $GATEWAY_PID 2>/dev/null; then
            echo "ERROR: Gateway exited within 20 s. Full log:"
            cat /tmp/openclaw.log
            exit 1
          fi

          # Check for fatal startup errors in the log
          if grep -qiE "fatal|unauthorized|invalid token|EFATAL|cannot read" /tmp/openclaw.log 2>/dev/null; then
            echo "ERROR: Fatal errors detected in gateway log. Full log:"
            cat /tmp/openclaw.log
            exit 1
          fi

          echo "LIVE: @Zypher0_bot | Instance #${INSTANCE_NUMBER} | Run $GITHUB_RUN_ID"

          # Run for ~3 h 40 min then rotate
          sleep 13200

          NEXT=$(( INSTANCE_NUMBER + 1 ))
          curl -s -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/$GITHUB_REPO/actions/workflows/openclaw.yml/dispatches" \
            -d "{\"ref\":\"main\",\"inputs\":{\"instance_number\":\"$NEXT\"}}" \
            && echo "Rotated to instance #$NEXT" \
            || echo "WARN: Rotation failed — next schedule will start fresh"

          sleep 120

          # Mark session as finished in Supabase
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_SERVICE_KEY" ]; then
            curl -s -X PATCH "$SUPABASE_URL/rest/v1/active_sessions?github_run_id=eq.$GITHUB_RUN_ID" \
              -H "apikey: $SUPABASE_SERVICE_KEY" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
              -H "Content-Type: application/json" \
              -d '{"is_active":false}' || true
          fi

          kill -TERM $GATEWAY_PID 2>/dev/null
          wait $GATEWAY_PID 2>/dev/null || true
          echo "Zypher stopped cleanly"
