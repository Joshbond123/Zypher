name: Zypher OpenClaw Agent

on:
  workflow_dispatch:
    inputs:
      instance_number:
        description: 'Instance number for tracking'
        required: false
        default: '1'
  schedule:
    - cron: '0 */4 * * *'

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 235

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install security tools + Google Chrome
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            nmap nikto sqlmap gobuster \
            hydra netcat-openbsd masscan \
            curl wget git jq \
            openssl net-tools whois dnsutils \
            dirb wfuzz wordlists \
            python3-pip python3-scapy \
            2>/dev/null || true
          pip install PyNaCl requests -q 2>/dev/null || true
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb -O /tmp/chrome.deb
          sudo apt-get install -y /tmp/chrome.deb 2>/dev/null \
            || (sudo dpkg -i /tmp/chrome.deb && sudo apt-get -f install -y) || true
          echo "Tools ready | Chrome: $(google-chrome --version 2>/dev/null || echo not-found)"

      - name: Validate secrets are present
        env:
          TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CEREBRAS_API_KEY:     ${{ secrets.CEREBRAS_KEY_1 }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          MISSING=0
          [ -z "$TELEGRAM_BOT_TOKEN" ] && echo "ERROR: TELEGRAM_BOT_TOKEN not set" && MISSING=1
          [ -z "$CEREBRAS_API_KEY" ]   && echo "ERROR: CEREBRAS_KEY_1 not set"     && MISSING=1
          [ -z "$SUPABASE_URL" ]         && echo "WARN:  SUPABASE_URL not set (memory disabled)"
          [ -z "$SUPABASE_SERVICE_KEY" ] && echo "WARN:  SUPABASE_SERVICE_KEY not set (memory disabled)"
          [ "$MISSING" = "1" ] && exit 1 || echo "Required secrets present"

      - name: Validate Telegram bot token
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          RESPONSE=$(curl -sf "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getMe" 2>&1)
          if echo "$RESPONSE" | grep -q '"ok":true'; then
            BOT_NAME=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['result'].get('username','?'))")
            echo "Telegram token valid — bot: @${BOT_NAME}"
          else
            echo "ERROR: Telegram token is invalid or unreachable"
            echo "Response: $RESPONSE"
            exit 1
          fi

      - name: Install OpenClaw
        run: |
          npm install -g openclaw
          echo "OpenClaw $(openclaw --version 2>/dev/null || echo installed)"

      - name: OpenClaw onboard (Cerebras)
        env:
          CEREBRAS_API_KEY:   ${{ secrets.CEREBRAS_KEY_1 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          openclaw onboard \
            --non-interactive \
            --mode local \
            --auth-choice cerebras-api-key \
            --cerebras-api-key "$CEREBRAS_API_KEY" \
            --accept-risk \
            --skip-health \
            --skip-bootstrap \
            2>&1 | tail -5 || true
          echo "Onboard complete (dir: $(ls ~/.openclaw/ 2>/dev/null | tr '\n' ' '))"

      - name: Write openclaw.json from template
        env:
          TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TAVILY_API_KEY:       ${{ secrets.TAVILY_KEY_1 }}
          TAVILY_API_KEY_2:     ${{ secrets.TAVILY_KEY_2 }}
          CEREBRAS_API_KEY:     ${{ secrets.CEREBRAS_KEY_1 }}
          CEREBRAS_API_KEY_2:   ${{ secrets.CEREBRAS_KEY_2 }}
          CEREBRAS_API_KEY_3:   ${{ secrets.CEREBRAS_KEY_3 }}
          CEREBRAS_API_KEY_4:   ${{ secrets.CEREBRAS_KEY_4 }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          mkdir -p ~/.openclaw/workspace/memory
          cp AGENTS.md ~/.openclaw/workspace/AGENTS.md

          # Use KEY_1 as fallback for any missing numbered keys
          K2="${CEREBRAS_API_KEY_2:-$CEREBRAS_API_KEY}"
          K3="${CEREBRAS_API_KEY_3:-$CEREBRAS_API_KEY}"
          K4="${CEREBRAS_API_KEY_4:-$CEREBRAS_API_KEY}"

          # Token substitution — 4 Cerebras provider placeholders
          sed \
            -e "s|TELEGRAM_TOKEN_HERE|${TELEGRAM_BOT_TOKEN}|g" \
            -e "s|CEREBRAS_KEY_1_HERE|${CEREBRAS_API_KEY}|g" \
            -e "s|CEREBRAS_KEY_2_HERE|${K2}|g" \
            -e "s|CEREBRAS_KEY_3_HERE|${K3}|g" \
            -e "s|CEREBRAS_KEY_4_HERE|${K4}|g" \
            -e "s|TAVILY_KEY_HERE|${TAVILY_API_KEY}|g" \
            -e "s|SUPABASE_URL_HERE|${SUPABASE_URL}|g" \
            -e "s|SUPABASE_KEY_HERE|${SUPABASE_SERVICE_KEY}|g" \
            scripts/oc_template.json > ~/.openclaw/openclaw.json

          # Tavily: use KEY_2 as fallback or disable cleanly
          if [ -z "$TAVILY_API_KEY" ] && [ -n "$TAVILY_API_KEY_2" ]; then
            echo "INFO: TAVILY_KEY_1 absent — using TAVILY_KEY_2 as primary"
            jq ".tools.web.search.apiKey = \"${TAVILY_API_KEY_2}\" | .plugins.entries.tavily.enabled = true" \
              ~/.openclaw/openclaw.json > /tmp/oc_patched.json \
              && mv /tmp/oc_patched.json ~/.openclaw/openclaw.json
          elif [ -z "$TAVILY_API_KEY" ]; then
            echo "WARN: No Tavily key — disabling search provider"
            jq '.tools.web.search = {"provider": null, "enabled": false} | .plugins.entries.tavily.enabled = false' \
              ~/.openclaw/openclaw.json > /tmp/oc_patched.json \
              && mv /tmp/oc_patched.json ~/.openclaw/openclaw.json
          else
            echo "Tavily KEY_1 active"
          fi

          echo '{ "security": "full", "ask": "off" }' > ~/.openclaw/exec-approvals.json

          # Sanity check — no unfilled placeholders
          if grep -qE "TELEGRAM_TOKEN_HERE|CEREBRAS_KEY_[0-9]_HERE" ~/.openclaw/openclaw.json; then
            echo "ERROR: Template placeholders not substituted"
            grep -E "TELEGRAM_TOKEN_HERE|CEREBRAS_KEY_[0-9]_HERE" ~/.openclaw/openclaw.json
            exit 1
          fi

          python3 -c "
          import json, sys, os
          c = json.load(open(os.path.expanduser('~/.openclaw/openclaw.json')))
          tg = c.get('channels',{}).get('telegram',{})
          assert tg.get('enabled') == True, 'telegram not enabled'
          tok = tg.get('botToken','')
          assert tok and tok != 'TELEGRAM_TOKEN_HERE', 'botToken not injected'
          model_cfg = c.get('agents',{}).get('defaults',{}).get('model',{})
          primary = model_cfg.get('primary','')
          fallbacks = model_cfg.get('fallbacks', [])
          assert primary, 'model.primary not configured'
          assert len(fallbacks) > 0, 'model.fallbacks empty'
          providers = c.get('models',{}).get('providers',{})
          num_providers = len([p for p in providers if 'cerebras' in p.lower()])
          print('Config OK — primary=%s fallbacks=%d providers=%d streaming=%s' % (
              primary, len(fallbacks), num_providers,
              tg.get('streaming',{}).get('mode','off')))
          " || exit 1
          echo "All config sanity checks passed"
          echo "=== Config preview (keys masked) ==="
          python3 -c "
          import json, os, re
          raw = open(os.path.expanduser('~/.openclaw/openclaw.json')).read()
          masked = re.sub(r'(\"apiKey\"|\"botToken\")\s*:\s*\"[^\"]{8,}\"', r'\1: \"***\"', raw)
          print(masked[:2500])
          "

      - name: Run cerebras_key_rotator.py (round-robin key selection)
        env:
          CEREBRAS_API_KEY:     ${{ secrets.CEREBRAS_KEY_1 }}
          CEREBRAS_API_KEY_2:   ${{ secrets.CEREBRAS_KEY_2 }}
          CEREBRAS_API_KEY_3:   ${{ secrets.CEREBRAS_KEY_3 }}
          CEREBRAS_API_KEY_4:   ${{ secrets.CEREBRAS_KEY_4 }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GITHUB_RUN_ID:        ${{ github.run_id }}
        run: |
          echo "=== Cerebras Key Rotator ==="
          python3 scripts/cerebras_key_rotator.py 2>&1
          echo "=== Rotator complete ==="

      - name: Run openclaw doctor --fix
        run: |
          echo "=== openclaw doctor --fix ==="
          openclaw doctor --fix 2>&1 || true
          echo "=== Doctor complete ==="

      - name: Install stealth-browser + Tavily from ClawHub
        run: |
          openclaw skills install clawhub:stealth-browser 2>&1 \
            || openclaw plugins install clawhub:stealth-browser 2>&1 \
            || echo "stealth-browser bundled fallback active"
          openclaw skills install clawhub:tavily 2>&1 \
            || openclaw plugins install npm:@openclaw/tavily 2>&1 \
            || echo "tavily skill install skipped"
          # NOTE: clawhub:supabase intentionally NOT installed.
          # supabase plugin is disabled in config; sidecar handles persistence.
          openclaw plugins list 2>/dev/null || true
          openclaw skills list  2>/dev/null || true

      - name: Bootstrap memory from Supabase
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GITHUB_RUN_ID:        ${{ github.run_id }}
        run: |
          mkdir -p ~/.openclaw/workspace/memory
          echo "[]" > /tmp/sb_msgs.json
          echo "[]" > /tmp/sb_facts.json
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_SERVICE_KEY" ]; then
            curl -sf "$SUPABASE_URL/rest/v1/chat_messages?order=created_at.desc&limit=30&select=role,content,created_at" \
              -H "apikey: $SUPABASE_SERVICE_KEY" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
              -o /tmp/sb_msgs.json \
              && echo "Chat messages fetched" \
              || { echo "WARN: could not fetch chat_messages"; echo "[]" > /tmp/sb_msgs.json; }
            curl -sf "$SUPABASE_URL/rest/v1/longterm_memory?order=created_at.desc&limit=20&select=key,value" \
              -H "apikey: $SUPABASE_SERVICE_KEY" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
              -o /tmp/sb_facts.json \
              && echo "Long-term facts fetched" \
              || { echo "WARN: could not fetch longterm_memory"; echo "[]" > /tmp/sb_facts.json; }
          else
            echo "Supabase not configured — fresh session"
          fi
          python3 scripts/bootstrap_memory.py \
            --msgs  /tmp/sb_msgs.json \
            --facts /tmp/sb_facts.json \
            --run-id "$GITHUB_RUN_ID" \
            --out   ~/.openclaw/workspace/MEMORY.md \
            && echo "Memory bootstrapped" \
            || { echo "Bootstrap error — blank memory";
                 printf "# Zypher Memory\nFresh session\n" > ~/.openclaw/workspace/MEMORY.md; }
          TODAY=$(date -u '+%Y-%m-%d')
          DAILY_NOTE=~/.openclaw/workspace/memory/${TODAY}.md
          if [ ! -f "$DAILY_NOTE" ]; then
            printf "# Zypher Daily Notes — %s\nSession: %s\n" "$TODAY" "$GITHUB_RUN_ID" > "$DAILY_NOTE"
          fi

      - name: Register session in Supabase
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GITHUB_RUN_ID:        ${{ github.run_id }}
          INSTANCE_NUMBER:      ${{ github.event.inputs.instance_number || '1' }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_KEY" ]; then
            echo "Supabase not configured — skipping"; exit 0
          fi
          EXPIRES=$(python3 -c "
          from datetime import datetime, timezone, timedelta
          print((datetime.now(timezone.utc)+timedelta(hours=4)).strftime('%Y-%m-%dT%H:%M:%SZ'))
          ")
          curl -s -X POST "$SUPABASE_URL/rest/v1/active_sessions" \
            -H "apikey: $SUPABASE_SERVICE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "{\"github_run_id\":\"$GITHUB_RUN_ID\",\"workflow_name\":\"openclaw.yml\",\"instance_number\":$INSTANCE_NUMBER,\"is_active\":true,\"expires_at\":\"$EXPIRES\"}" \
            && echo "Session registered (expires $EXPIRES)" \
            || echo "WARN: Session registration failed (non-fatal)"

      - name: Start Supabase bridge sidecar
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GITHUB_RUN_ID:        ${{ github.run_id }}
        run: |
          python3 -m py_compile scripts/zypher_agent.py \
            && echo "Sidecar syntax OK" \
            || { echo "ERROR: zypher_agent.py syntax error"; exit 1; }
          python3 scripts/zypher_agent.py > /tmp/sidecar.log 2>&1 &
          SIDECAR_PID=$!
          sleep 3
          if ! kill -0 $SIDECAR_PID 2>/dev/null; then
            echo "ERROR: Sidecar crashed. Log:"; cat /tmp/sidecar.log; exit 1
          fi
          echo "Sidecar running (PID $SIDECAR_PID)"

      - name: Start OpenClaw Gateway + periodic doctor
        env:
          TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CEREBRAS_API_KEY:     ${{ secrets.CEREBRAS_KEY_1 }}
          CEREBRAS_API_KEY_2:   ${{ secrets.CEREBRAS_KEY_2 }}
          CEREBRAS_API_KEY_3:   ${{ secrets.CEREBRAS_KEY_3 }}
          CEREBRAS_API_KEY_4:   ${{ secrets.CEREBRAS_KEY_4 }}
          TAVILY_API_KEY:       ${{ secrets.TAVILY_KEY_1 }}
          TAVILY_API_KEY_2:     ${{ secrets.TAVILY_KEY_2 }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GITHUB_RUN_ID:        ${{ github.run_id }}
          GITHUB_TOKEN:         ${{ secrets.GH_PAT }}
          GITHUB_REPO:          ${{ github.repository }}
          INSTANCE_NUMBER:      ${{ github.event.inputs.instance_number || '1' }}
        run: |
          echo "=== Pre-flight: openclaw.json validation ==="
          python3 -c "
          import json, sys, os
          try:
              cfg = json.load(open(os.path.expanduser('~/.openclaw/openclaw.json')))
              tg  = cfg.get('channels', {}).get('telegram', {})
              model_cfg = cfg.get('agents', {}).get('defaults', {}).get('model', {})
              primary = model_cfg.get('primary', 'NOT SET')
              fallbacks = model_cfg.get('fallbacks', [])
              providers = cfg.get('models', {}).get('providers', {})
              cerebras_providers = [p for p in providers if 'cerebras' in p.lower()]
              streaming = tg.get('streaming', {}).get('mode', 'off')
              sb_enabled = cfg.get('plugins', {}).get('entries', {}).get('supabase', {}).get('enabled', False)
              print('  telegram=%s  botToken_set=%s  streaming=%s' % (tg.get('enabled'), bool(tg.get('botToken','')), streaming))
              print('  model.primary=%s  fallbacks=%d  providers=%s  supabase_plugin=%s' % (
                  primary, len(fallbacks), cerebras_providers, sb_enabled))
              if not tg.get('botToken',''):
                  print('ERROR: botToken missing')
                  sys.exit(1)
              if not fallbacks:
                  print('WARN: No fallbacks configured')
          except Exception as e:
              print('Config error: %s' % e)
              sys.exit(1)
          "

          # Start periodic doctor (every 30 min) in background
          (
            while true; do
              sleep 1800
              echo "[$(date -u +%H:%M:%SZ)] Running scheduled openclaw doctor check..."
              openclaw doctor 2>&1 | tail -5 || true
              echo "[$(date -u +%H:%M:%SZ)] Key rotator stats:"
              python3 scripts/cerebras_key_rotator.py --stats 2>&1 \
                || python3 /dev/stdin << 'PYSTATS'
import json, os, time
sf = os.path.expanduser('~/.openclaw/cerebras_key_stats.json')
if os.path.exists(sf):
    stats = json.load(open(sf))
    for kid, st in stats.items():
        print(f"  {kid}: requests={st.get('request_count',0)} rate_limits={st.get('rate_limit_events',0)}")
else:
    print("  No stats file yet")
PYSTATS
            done
          ) &
          DOCTOR_PID=$!
          echo "Periodic doctor started (PID $DOCTOR_PID, every 30 min)"

          echo "Starting Zypher gateway..."
          openclaw gateway 2>&1 | tee /tmp/openclaw.log &
          TEE_PID=$!

          READY=0
          ELAPSED=0
          while [ $ELAPSED -lt 60 ]; do
            sleep 1
            ELAPSED=$(( ELAPSED + 1 ))
            if grep -qiE "ready|listening|started|telegram.*poll|gateway.*up|ingress|bot.*online|connected" /tmp/openclaw.log 2>/dev/null; then
              echo "Ready signal after ${ELAPSED}s"
              READY=1
              break
            fi
            if [ $ELAPSED -eq 20 ] && [ -s /tmp/openclaw.log ]; then
              if ! grep -qiE "fatal|crash|EFATAL|ECRITICAL|exited|refused|failed to start" /tmp/openclaw.log; then
                echo "No ready signal but no fatal errors at 20s — assuming startup in progress"
                READY=1
                break
              fi
            fi
          done

          echo "=== Gateway startup log (first 100 lines) ==="
          head -100 /tmp/openclaw.log 2>/dev/null || echo "(log empty)"

          if ! kill -0 $TEE_PID 2>/dev/null; then
            echo "ERROR: Gateway pipeline exited. Full log:"; cat /tmp/openclaw.log; exit 1
          fi

          if [ "$READY" = "0" ]; then
            echo "ERROR: No ready signal in 60s. Full log:"; cat /tmp/openclaw.log; exit 1
          fi

          echo "LIVE: @Zypher0_bot | Run $GITHUB_RUN_ID | Instance #$INSTANCE_NUMBER"

          # Startup notification
          python3 -c "
          import os, urllib.request, json as J
          tok  = os.environ.get('TELEGRAM_BOT_TOKEN', '')
          rid  = os.environ.get('GITHUB_RUN_ID', '?')
          inst = os.environ.get('INSTANCE_NUMBER', '1')
          msg  = chr(0x1F7E2) + ' Zypher online | Instance #' + inst + ' | Run ' + rid + chr(0xA) + 'Ready! (4 Cerebras keys, 11-entry fallback chain, streaming active)'
          try:
              data = J.dumps({'chat_id': '6317345496', 'text': msg}).encode()
              req  = urllib.request.Request(
                  'https://api.telegram.org/bot' + tok + '/sendMessage',
                  data=data, headers={'Content-Type': 'application/json'}
              )
              urllib.request.urlopen(req, timeout=10)
              print('Startup notification sent')
          except Exception as e:
              print('WARN notification failed: ' + str(e))
          "

          # Run for 215 minutes then hand off
          sleep 12900

          # Trigger next instance
          NEXT=$(( INSTANCE_NUMBER + 1 ))
          curl -s -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/$GITHUB_REPO/actions/workflows/openclaw.yml/dispatches" \
            -d "{\"ref\":\"main\",\"inputs\":{\"instance_number\":\"$NEXT\"}}" \
            && echo "Rotated to instance #$NEXT" \
            || echo "WARN: Rotation failed"

          # 5-min overlap handoff
          sleep 300

          # Mark session inactive
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_SERVICE_KEY" ]; then
            curl -s -X PATCH "$SUPABASE_URL/rest/v1/active_sessions?github_run_id=eq.$GITHUB_RUN_ID" \
              -H "apikey: $SUPABASE_SERVICE_KEY" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
              -H "Content-Type: application/json" \
              -d '{"is_active":false}' || true
          fi

          # Graceful shutdown
          kill $DOCTOR_PID 2>/dev/null || true
          OPENCLAW_PID=$(pgrep -f "openclaw gateway" | head -1)
          if [ -n "$OPENCLAW_PID" ]; then
            kill -TERM "$OPENCLAW_PID" 2>/dev/null || true
            sleep 5
            kill -KILL "$OPENCLAW_PID" 2>/dev/null || true
          fi
          kill "$TEE_PID" 2>/dev/null || true
          echo "Zypher stopped cleanly (instance #$INSTANCE_NUMBER)"
