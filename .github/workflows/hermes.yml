name: Zypher Hermes Agent

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "frontend/**"
  workflow_dispatch:
    inputs:
      instance_number:
        description: 'Instance number'
        required: false
        default: '1'
      reset_memory:
        description: 'Reset memory'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
  schedule:
    - cron: '0 */4 * * *'

concurrency:
  group: zypher-singleton

jobs:
  run-agent:
    runs-on: ubuntu-latest
    # FIX-1: Increased from 235 to 240 minutes.
    # ROOT CAUSE: TIMEOUT=13500 (225 min) + startup overhead (~15 min) totals ~240 min
    # which hit or exceeded the old 235-min job limit. Cleanup steps (upload-artifact
    # etc.) were never guaranteed to run in the remaining post-cancellation grace
    # window. Increasing to 240 and reducing TIMEOUT to 12000 (200 min) guarantees
    # ~25 min of startup+cleanup headroom every run.
    timeout-minutes: 240
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore memory artifact from previous run
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          mkdir -p /tmp/memory-restore
          echo "Searching for latest zypher-hermes-memory artifact..."
          RESTORED=0
          RUN_IDS=$(gh run list \
            --workflow hermes.yml \
            --limit 20 \
            --json databaseId,conclusion \
            -q '.[] | select(.conclusion == "success" or .conclusion == "cancelled" or .conclusion == "timed_out" or .conclusion == "failure") | .databaseId' \
            2>/dev/null || echo "")
          for RUN_ID_PREV in $RUN_IDS; do
            if gh run download "$RUN_ID_PREV" \
              --name zypher-hermes-memory \
              --dir /tmp/memory-restore \
              2>/dev/null; then
              echo "Restored artifact from run $RUN_ID_PREV"
              RESTORED=1
              break
            fi
          done
          if [ "$RESTORED" -eq 0 ]; then
            echo "No prior artifact found — fresh start"
          fi
          echo "=== Restored files ==="
          find /tmp/memory-restore -type f 2>/dev/null | sort || echo "(empty)"

      - name: Cancel other in-progress runs
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          THIS_RUN: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          RUNS=$(curl -sf -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/$REPO/actions/runs?status=in_progress&per_page=20" \
            | jq -r --arg T "$THIS_RUN" '.workflow_runs[]|select(.id|tostring!=$T)|.id' 2>/dev/null || true)
          for RID in $RUNS; do
            curl -sf -X POST -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/$REPO/actions/runs/$RID/cancel" && echo "Cancelled $RID" || true
          done
          echo "Cancel step done"

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            nmap nikto sqlmap gobuster hydra netcat-openbsd masscan curl wget git jq \
            openssl net-tools whois dnsutils dirb wfuzz ripgrep ffmpeg python3-pip 2>/dev/null || true
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb -O /tmp/chrome.deb
          sudo apt-get install -y /tmp/chrome.deb 2>/dev/null \
            || (sudo dpkg -i /tmp/chrome.deb && sudo apt-get -f install -y) || true
          pip install playwright -q && python -m playwright install chromium --with-deps 2>/dev/null || true

      - name: Validate secrets
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_KEY_1 }}
        run: |
          [ -z "$TELEGRAM_BOT_TOKEN" ] && echo 'ERROR: TELEGRAM_BOT_TOKEN not set' && exit 1 || true
          [ -z "$CEREBRAS_API_KEY" ]   && echo 'ERROR: CEREBRAS_KEY_1 not set'     && exit 1 || true
          echo 'Secrets OK'

      - name: Validate Telegram token
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          RESP=$(curl -sf "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getMe")
          echo "$RESP" | grep -q '"ok":true' && echo 'Telegram token OK' || { echo 'ERROR: invalid token'; exit 1; }

      - name: Clear Telegram webhook (ensure polling mode)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python3 scripts/telegram_webhook_fix.py

      - name: Install Hermes Agent
        run: pip install hermes-agent --upgrade -q

      - name: Configure Hermes directories
        run: mkdir -p ~/.hermes/memories ~/.hermes/workspace ~/.hermes/skills

      - name: Write Hermes config.yaml
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_USER_ID: ${{ secrets.TELEGRAM_USER_ID }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_KEY_1 }}
        run: |
          python3 scripts/hermes_setup.py write-config
          echo "=== ~/.hermes/config.yaml ===" && cat ~/.hermes/config.yaml

      - name: Write Hermes .env
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_KEY_1 }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_KEY_1 }}
          TAVILY_API_KEY_2: ${{ secrets.TAVILY_KEY_2 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          TELEGRAM_USER_ID: ${{ secrets.TELEGRAM_USER_ID }}
        run: python3 scripts/hermes_setup.py write-env

      - name: Cerebras key rotation
        continue-on-error: true
        env:
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_KEY_1 }}
          CEREBRAS_API_KEY_2: ${{ secrets.CEREBRAS_KEY_2 }}
          CEREBRAS_API_KEY_3: ${{ secrets.CEREBRAS_KEY_3 }}
          CEREBRAS_API_KEY_4: ${{ secrets.CEREBRAS_KEY_4 }}
          CEREBRAS_API_KEY_5: ${{ secrets.CEREBRAS_KEY_5 }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python3 scripts/hermes_key_rotator.py

      - name: Bootstrap memory and state
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p ~/.hermes/memories ~/.hermes/skills
          R="/tmp/memory-restore"
          # Restore MEMORY.md (flat path first, then nested for old-format artifacts)
          for SRC in "$R/MEMORY.md" "$R/memories/MEMORY.md"; do
            [ -f "$SRC" ] && cp "$SRC" ~/.hermes/memories/MEMORY.md \
              && echo "restored: MEMORY.md from $SRC" && break || true
          done
          [ -f ~/.hermes/memories/MEMORY.md ] || \
            find "$R" -name "MEMORY.md" 2>/dev/null | head -1 | \
            xargs -I{} sh -c 'cp "{}" ~/.hermes/memories/MEMORY.md && echo "restored: MEMORY.md (search)"' 2>/dev/null || true
          # Restore USER.md
          for SRC in "$R/USER.md" "$R/memories/USER.md"; do
            [ -f "$SRC" ] && cp "$SRC" ~/.hermes/memories/USER.md \
              && echo "restored: USER.md from $SRC" && break || true
          done
          # Restore state.db (artifact already WAL-safe via sqlite3.backup)
          [ -f "$R/state.db" ] && cp "$R/state.db" ~/.hermes/state.db \
            && echo "restored: state.db" || echo "state.db: not in artifact"
          # Restore skills
          [ -f "$R/skills.tar.gz" ] && \
            tar xzf "$R/skills.tar.gz" -C ~/.hermes/skills/ 2>/dev/null \
            && echo "restored: skills" || true
          # Run Python bootstrap (WAL-safe state.db restore + Supabase fallback + SOUL.md restore)
          python3 scripts/hermes_bootstrap_memory.py || true
          # FIX-4: SOUL.md conditional — only fall back to AGENTS.md if no prior SOUL.md
          # was restored. hermes_bootstrap_memory.py writes ~/.hermes/SOUL.md when it finds
          # one in the artifact or Supabase; we only overwrite when nothing was found.
          if [ ! -s ~/.hermes/SOUL.md ]; then
            cp AGENTS.md ~/.hermes/SOUL.md
            echo "SOUL.md: initialized from AGENTS.md (no prior SOUL.md in artifact)"
          else
            echo "SOUL.md: retained from artifact/Supabase ($(wc -c < ~/.hermes/SOUL.md)b)"
          fi
          echo "=== Memory layout after bootstrap ==="
          find ~/.hermes -maxdepth 2 -type f 2>/dev/null | sort

      - name: Reset memory
        if: github.event.inputs.reset_memory == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          rm -f ~/.hermes/memories/MEMORY.md ~/.hermes/memories/USER.md
          python3 scripts/clear_memory.py || true

      - name: Ensure Supabase schema
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python3 scripts/setup_schema.py || true

      - name: Pre-approve bot owner (bypass pairing)
        env:
          TELEGRAM_USER_ID: ${{ secrets.TELEGRAM_USER_ID }}
        run: python3 scripts/hermes_preapprove.py

      # ─── Start key-rotation proxy BEFORE the gateway ────────────────────────
      - name: Start Cerebras key-rotation proxy
        env:
          CEREBRAS_API_KEY:   ${{ secrets.CEREBRAS_KEY_1 }}
          CEREBRAS_API_KEY_2: ${{ secrets.CEREBRAS_KEY_2 }}
          CEREBRAS_API_KEY_3: ${{ secrets.CEREBRAS_KEY_3 }}
          CEREBRAS_API_KEY_4: ${{ secrets.CEREBRAS_KEY_4 }}
          CEREBRAS_API_KEY_5: ${{ secrets.CEREBRAS_KEY_5 }}
          KEY_PROXY_PORT: "7860"
        run: |
          nohup python3 scripts/hermes_key_proxy.py > /tmp/hermes-proxy.log 2>&1 &
          PROXY_PID=$!
          echo "PROXY_PID=$PROXY_PID" >> $GITHUB_ENV
          echo "Proxy PID=$PROXY_PID"
          PROXY_READY=0
          for i in $(seq 1 20); do
            sleep 1
            if curl -sf http://127.0.0.1:7860/v1/models \
              -H "Authorization: Bearer test" -o /dev/null 2>/dev/null; then
              echo "Proxy ready after ${i}s"
              PROXY_READY=1
              break
            fi
          done
          echo "=== proxy startup log ==="
          cat /tmp/hermes-proxy.log || true
          if [ "$PROXY_READY" -eq 0 ]; then
            echo "FATAL: key-rotation proxy did not start within 20s. Check CEREBRAS_KEY_1."
            exit 1
          fi
          echo "Proxy health check PASSED"

      # ─── Cerebras preflight AFTER proxy starts ───────────────────────────────
      - name: Cerebras preflight (model validation + config auto-heal)
        continue-on-error: true
        env:
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_KEY_1 }}
          KEY_PROXY_PORT: "7860"
        run: python3 scripts/hermes_provider_preflight.py

      # ─── Start Hermes gateway ────────────────────────────────────────────────
      - name: Start Hermes gateway
        env:
          OPENAI_API_KEY: "proxy-placeholder"
          OPENROUTER_API_KEY: "proxy-placeholder"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_USER_ID: ${{ secrets.TELEGRAM_USER_ID }}
          TELEGRAM_ALLOWED_USERS: ${{ secrets.TELEGRAM_USER_ID }}
          TELEGRAM_HOME_CHANNEL: ${{ secrets.TELEGRAM_USER_ID }}
          TELEGRAM_HOME_CHANNEL_NAME: "Zypher Home"
          TAVILY_API_KEY: ${{ secrets.TAVILY_KEY_1 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          HERMES_YOLO_MODE: "1"
          HERMES_GATEWAY_SESSION: "1"
        run: |
          nohup hermes gateway run --accept-hooks > /tmp/hermes.log 2>&1 &
          HERMES_PID=$!
          echo "HERMES_PID=$HERMES_PID" >> $GITHUB_ENV
          echo "Hermes gateway PID=$HERMES_PID"
          sleep 35
          echo "=== Hermes startup log (first 100 lines) ==="
          head -100 /tmp/hermes.log || true

      - name: Start pairing auto-approver
        env:
          TELEGRAM_USER_ID: ${{ secrets.TELEGRAM_USER_ID }}
        run: |
          nohup python3 scripts/hermes_pairing_watcher.py > /tmp/hermes-pairing.log 2>&1 &
          echo "PAIRING_PID=$!" >> $GITHUB_ENV
          echo "Pairing watcher started"

      - name: Send startup notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_USER_ID: ${{ secrets.TELEGRAM_USER_ID }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python3 scripts/hermes_startup_notify.py

      - name: Start Supabase sidecar
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          nohup python3 scripts/hermes_sidecar.py > /tmp/hermes-sidecar.log 2>&1 &
          echo "SIDECAR_PID=$!" >> $GITHUB_ENV
          echo "Supabase sidecar started"

      # ─── Keep-alive loop ──────────────────────────────────────────────────────
      - name: Keep agent alive
        env:
          CEREBRAS_API_KEY:   ${{ secrets.CEREBRAS_KEY_1 }}
          CEREBRAS_API_KEY_2: ${{ secrets.CEREBRAS_KEY_2 }}
          CEREBRAS_API_KEY_3: ${{ secrets.CEREBRAS_KEY_3 }}
          CEREBRAS_API_KEY_4: ${{ secrets.CEREBRAS_KEY_4 }}
          CEREBRAS_API_KEY_5: ${{ secrets.CEREBRAS_KEY_5 }}
          OPENAI_API_KEY: "proxy-placeholder"
          OPENROUTER_API_KEY: "proxy-placeholder"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_USER_ID: ${{ secrets.TELEGRAM_USER_ID }}
          TELEGRAM_ALLOWED_USERS: ${{ secrets.TELEGRAM_USER_ID }}
          TELEGRAM_HOME_CHANNEL: ${{ secrets.TELEGRAM_USER_ID }}
          TELEGRAM_HOME_CHANNEL_NAME: "Zypher Home"
          TAVILY_API_KEY: ${{ secrets.TAVILY_KEY_1 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          KEY_PROXY_PORT: "7860"
          HERMES_YOLO_MODE: "1"
          HERMES_GATEWAY_SESSION: "1"
        run: |
          # FIX-1: Reduced from 13500 (225 min) to 12000 (200 min).
          # Old value + startup overhead hit the 235-min job limit, leaving cleanup
          # (upload-artifact) unable to run reliably. 12000 leaves ~25 min for
          # startup + cleanup inside the new 240-min job timeout.
          TIMEOUT=12000
          ELAPSED=0
          INTERVAL=30
          echo "Keep-alive: ${TIMEOUT}s total"
          while [ $ELAPSED -lt $TIMEOUT ]; do
            sleep $INTERVAL
            ELAPSED=$((ELAPSED+INTERVAL))
            if ! kill -0 $PROXY_PID 2>/dev/null; then
              echo "[${ELAPSED}s] Key proxy died — restarting..."
              nohup python3 scripts/hermes_key_proxy.py >> /tmp/hermes-proxy.log 2>&1 &
              PROXY_PID=$!
              # FIX-2: Write updated PID to GITHUB_ENV so "Stop all processes"
              # kills the correct instance even after an in-session restart.
              echo "PROXY_PID=$PROXY_PID" >> $GITHUB_ENV
              for i in $(seq 1 15); do
                sleep 1
                curl -sf http://127.0.0.1:7860/v1/models \
                  -H "Authorization: Bearer test" -o /dev/null 2>/dev/null \
                  && echo "[${ELAPSED}s] Proxy back after ${i}s" && break || true
              done
            fi
            if ! kill -0 $HERMES_PID 2>/dev/null; then
              echo "[${ELAPSED}s] Hermes died — restarting..."
              python3 scripts/hermes_preapprove.py 2>/dev/null || true
              nohup hermes gateway run --accept-hooks >> /tmp/hermes.log 2>&1 &
              HERMES_PID=$!
              # FIX-2: Write updated PID to GITHUB_ENV so "Stop all processes"
              # kills the correct Hermes instance after an in-session restart.
              echo "HERMES_PID=$HERMES_PID" >> $GITHUB_ENV
              echo "[${ELAPSED}s] Hermes restarted PID=$HERMES_PID"
              sleep 10
            fi
            if ! kill -0 $PAIRING_PID 2>/dev/null; then
              nohup python3 scripts/hermes_pairing_watcher.py >> /tmp/hermes-pairing.log 2>&1 &
              PAIRING_PID=$!
              echo "PAIRING_PID=$PAIRING_PID" >> $GITHUB_ENV
            fi
            if ! kill -0 $SIDECAR_PID 2>/dev/null; then
              echo "[${ELAPSED}s] Sidecar died — restarting..."
              nohup python3 scripts/hermes_sidecar.py >> /tmp/hermes-sidecar.log 2>&1 &
              SIDECAR_PID=$!
              echo "SIDECAR_PID=$SIDECAR_PID" >> $GITHUB_ENV
            fi
            [ $((ELAPSED % 300)) -eq 0 ] && {
              python3 scripts/hermes_sidecar.py --flush-memory 2>/dev/null || true
              echo "[${ELAPSED}s] Memory + state.db flushed to Supabase"
            } || true
            [ $((ELAPSED % 600)) -eq 0 ] && {
              echo "=== hermes.log tail ===" && tail -5 /tmp/hermes.log 2>/dev/null || true
              echo "=== proxy.log tail ===" && tail -3 /tmp/hermes-proxy.log 2>/dev/null || true
            } || true
          done
          echo "Session rotation complete"

      # FIX-3: "Stop all processes" now runs BEFORE "Save memory and state".
      # Previously the Supabase flush ran while Hermes was still active. Any
      # writes between the flush and the eventual kill were lost from Supabase.
      # Killing first ensures the flush captures the fully-settled post-kill state.
      - name: Stop all processes
        if: always()
        run: |
          # Primary kill by PID (GITHUB_ENV — updated on restart by FIX-2)
          kill -TERM $HERMES_PID  2>/dev/null || true
          kill -TERM $PROXY_PID   2>/dev/null || true
          kill -TERM $PAIRING_PID 2>/dev/null || true
          kill -TERM $SIDECAR_PID 2>/dev/null || true
          # FIX-2: Belt-and-suspenders kill by process name — catches any instances
          # whose updated PID was not yet persisted to GITHUB_ENV before the job
          # was cancelled or timed out.
          pkill -TERM -f "hermes gateway run"        2>/dev/null || true
          pkill -TERM -f "hermes_key_proxy.py"       2>/dev/null || true
          pkill -TERM -f "hermes_pairing_watcher.py" 2>/dev/null || true
          pkill -TERM -f "hermes_sidecar.py"         2>/dev/null || true
          # Wait up to 20s for Hermes to exit cleanly (allows SQLite to flush WAL)
          for i in $(seq 1 20); do
            sleep 1
            { kill -0 $HERMES_PID 2>/dev/null || pgrep -f "hermes gateway run" > /dev/null 2>&1; } \
              || { echo "Hermes exited after ${i}s"; break; }
          done
          # Force-kill anything still running
          kill -KILL $HERMES_PID 2>/dev/null || true
          pkill -KILL -f "hermes gateway run" 2>/dev/null || true
          echo "Process cleanup complete"

      # FIX-3 (continued): Flush AFTER kill — Supabase now gets the fully-settled
      # post-kill state of all memory files and state.db.
      - name: Save memory and state (final WAL-safe flush to Supabase)
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python3 scripts/hermes_sidecar.py --flush-memory 2>/dev/null || true

      - name: Send rotation notification
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_USER_ID: ${{ secrets.TELEGRAM_USER_ID }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          curl -sf -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_USER_ID}" \
            -d "text=Zypher rotating (Run #${GITHUB_RUN_ID}). Back in seconds..." || true

      - name: Stage memory for artifact upload
        if: always()
        run: |
          python3 scripts/hermes_stage_artifact.py && STAGED=1 || STAGED=0
          if [ "$STAGED" -eq 0 ]; then
            mkdir -p /tmp/hermes-artifact
            cp ~/.hermes/memories/MEMORY.md /tmp/hermes-artifact/MEMORY.md 2>/dev/null || true
            cp ~/.hermes/memories/USER.md   /tmp/hermes-artifact/USER.md   2>/dev/null || true
            cp ~/.hermes/SOUL.md            /tmp/hermes-artifact/SOUL.md   2>/dev/null || true
            [ -f ~/.hermes/state.db ] && cp ~/.hermes/state.db /tmp/hermes-artifact/state.db || true
            echo 'Shell fallback staging used'
          fi
          echo '=== Staged files ==='
          ls -lh /tmp/hermes-artifact/ 2>/dev/null || echo '(nothing staged)'

      - name: Upload memory artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zypher-hermes-memory
          path: /tmp/hermes-artifact/
          retention-days: 90
          if-no-files-found: warn
          overwrite: true

      - name: Trigger next run (zero-gap rotation)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          REPO: ${{ github.repository }}
        run: |
          curl -sf -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/$REPO/actions/workflows/hermes.yml/dispatches" \
            -d '{"ref":"main"}' && echo 'Next run triggered' || echo 'WARN: trigger failed'
