name: Zypher Hermes Agent

  on:
    workflow_dispatch:
      inputs:
        instance_number:
          description: 'Instance number for tracking'
          required: false
          default: '1'
        reset_memory:
          description: 'Reset all memory (wipe Supabase + fresh MEMORY.md)'
          required: false
          default: 'false'
          type: choice
          options: ['false', 'true']
    schedule:
      - cron: '0 */4 * * *'

  concurrency:
    group: zypher-singleton
    cancel-in-progress: true

  jobs:
    run-agent:
      runs-on: ubuntu-latest
      timeout-minutes: 235

      steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Restore memory from previous run (artifact)
          uses: actions/download-artifact@v4
          with:
            name: zypher-hermes-memory
            path: /tmp/memory-restore
          continue-on-error: true

        - name: Cancel other in-progress runs
          env:
            GITHUB_TOKEN: ${{ secrets.GH_PAT }}
            GITHUB_REPO:  ${{ github.repository }}
            THIS_RUN_ID:  ${{ github.run_id }}
          run: |
            OTHER=$(curl -sf \
              -H "Authorization: token $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/$GITHUB_REPO/actions/runs?status=in_progress&per_page=20" \
              | jq -r --arg THIS "$THIS_RUN_ID" '.workflow_runs[] | select(.id|tostring != $THIS) | .id')
            if [ -z "$OTHER" ]; then echo "No other runs to cancel."
            else
              for RID in $OTHER; do
                curl -sf -X POST -H "Authorization: token $GITHUB_TOKEN" \
                  -H "Accept: application/vnd.github.v3+json" \
                  "https://api.github.com/repos/$GITHUB_REPO/actions/runs/$RID/cancel" \
                  && echo "  cancelled $RID" || echo "  WARN: could not cancel $RID"
              done
            fi

        - name: Setup Python 3.11
          uses: actions/setup-python@v5
          with:
            python-version: '3.11'

        - name: Setup Node.js 22
          uses: actions/setup-node@v4
          with:
            node-version: '22'

        - name: Install system tools + Google Chrome
          run: |
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends \
              nmap nikto sqlmap gobuster hydra netcat-openbsd masscan \
              curl wget git jq openssl net-tools whois dnsutils \
              dirb wfuzz ripgrep ffmpeg python3-pip 2>/dev/null || true
            wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb -O /tmp/chrome.deb
            sudo apt-get install -y /tmp/chrome.deb 2>/dev/null \
              || (sudo dpkg -i /tmp/chrome.deb && sudo apt-get -f install -y) || true
            echo "Chrome: $(google-chrome --version 2>/dev/null || echo not-found)"

        - name: Install Playwright (browser automation)
          run: |
            pip install playwright -q
            python -m playwright install chromium --with-deps 2>/dev/null || true
            echo "Playwright ready"

        - name: Validate required secrets
          env:
            TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
            CEREBRAS_API_KEY:   ${{ secrets.CEREBRAS_KEY_1 }}
          run: |
            MISSING=0
            [ -z "$TELEGRAM_BOT_TOKEN" ] && echo "ERROR: TELEGRAM_BOT_TOKEN not set" && MISSING=1
            [ -z "$CEREBRAS_API_KEY" ]   && echo "ERROR: CEREBRAS_KEY_1 not set"     && MISSING=1
            [ "$MISSING" = "1" ] && exit 1 || echo "Required secrets verified OK"

        - name: Validate Telegram bot token
          env:
            TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          run: |
            RESP=$(curl -sf "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getMe")
            if echo "$RESP" | grep -q '"ok":true'; then
              BOT=$(echo "$RESP" | jq -r '.result.username // "unknown"')
              echo "Telegram OK — bot: @${BOT}"
            else
              echo "ERROR: Telegram token invalid"; exit 1
            fi

        - name: Install Hermes Agent
          run: |
            pip install hermes-agent --upgrade -q
            echo "Hermes: $(hermes --version 2>/dev/null || hermes version 2>/dev/null || echo installed)"

        - name: Configure Hermes directories
          run: mkdir -p ~/.hermes/memories ~/.hermes/workspace ~/.hermes/skills

        - name: Write Hermes config.yaml
          env:
            TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
            TELEGRAM_USER_ID:     ${{ secrets.TELEGRAM_USER_ID }}
            CEREBRAS_API_KEY:     ${{ secrets.CEREBRAS_KEY_1 }}
            CEREBRAS_API_KEY_2:   ${{ secrets.CEREBRAS_KEY_2 }}
          run: |
            python3 scripts/hermes_setup.py write-config
            cat ~/.hermes/config.yaml

        - name: Write Hermes .env
          env:
            TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
            CEREBRAS_API_KEY:     ${{ secrets.CEREBRAS_KEY_1 }}
            TAVILY_API_KEY:       ${{ secrets.TAVILY_KEY_1 }}
            TAVILY_API_KEY_2:     ${{ secrets.TAVILY_KEY_2 }}
            SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
            SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
            GITHUB_TOKEN:         ${{ secrets.GH_PAT }}
          run: python3 scripts/hermes_setup.py write-env

        - name: Cerebras key rotation
          env:
            CEREBRAS_API_KEY:   ${{ secrets.CEREBRAS_KEY_1 }}
            CEREBRAS_API_KEY_2: ${{ secrets.CEREBRAS_KEY_2 }}
            CEREBRAS_API_KEY_3: ${{ secrets.CEREBRAS_KEY_3 }}
            CEREBRAS_API_KEY_4: ${{ secrets.CEREBRAS_KEY_4 }}
            GITHUB_RUN_ID:      ${{ github.run_id }}
          run: python3 scripts/hermes_key_rotator.py

        - name: Provider preflight (Cerebras API)
          env:
            CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_KEY_1 }}
          run: python3 scripts/hermes_provider_preflight.py

        - name: Bootstrap memory (artifact restore + Supabase enrich)
          env:
            SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
            SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
            GITHUB_RUN_ID:        ${{ github.run_id }}
          run: |
            mkdir -p ~/.hermes/memories
            if [ -f /tmp/memory-restore/MEMORY.md ]; then
              cp /tmp/memory-restore/MEMORY.md ~/.hermes/memories/MEMORY.md
              echo "MEMORY.md restored from artifact ($(wc -l < ~/.hermes/memories/MEMORY.md) lines)"
            fi
            if [ -f /tmp/memory-restore/USER.md ]; then
              cp /tmp/memory-restore/USER.md ~/.hermes/memories/USER.md
              echo "USER.md restored from artifact"
            fi
            python3 scripts/hermes_bootstrap_memory.py || echo "WARN: bootstrap non-fatal"
            cp AGENTS.md ~/.hermes/AGENTS.md
            echo "AGENTS.md installed"

        - name: Reset memory (only when reset_memory=true)
          if: ${{ github.event.inputs.reset_memory == 'true' }}
          env:
            SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
            SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          run: |
            rm -f ~/.hermes/memories/MEMORY.md ~/.hermes/memories/USER.md
            python3 scripts/clear_memory.py || true
            echo "Memory cleared"

        - name: Ensure Supabase schema exists
          env:
            SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
            SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
            GITHUB_RUN_ID:        ${{ github.run_id }}
          run: python3 scripts/setup_schema.py || echo "WARN: schema non-fatal"

        - name: Start Hermes agent (background)
          env:
            TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
            CEREBRAS_API_KEY:     ${{ secrets.CEREBRAS_KEY_1 }}
            TAVILY_API_KEY:       ${{ secrets.TAVILY_KEY_1 }}
            SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
            SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
            GITHUB_RUN_ID:        ${{ github.run_id }}
          run: |
            nohup hermes start --no-interactive --telegram --config ~/.hermes/config.yaml > /tmp/hermes.log 2>&1 &
            echo "HERMES_PID=$!" >> $GITHUB_ENV
            echo "Hermes PID=$HERMES_PID"
            WAIT=0
            while [ $WAIT -lt 30 ]; do
              if grep -qi "ready\|started\|listening\|telegram" /tmp/hermes.log 2>/dev/null; then
                echo "Hermes initialized (after ${WAIT}s)"; break
              fi
              sleep 2; WAIT=$((WAIT+2))
            done
            head -50 /tmp/hermes.log || true

        - name: Send startup notification
          env:
            TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
            TELEGRAM_USER_ID:   ${{ secrets.TELEGRAM_USER_ID }}
            GITHUB_RUN_ID:      ${{ github.run_id }}
          run: python3 scripts/hermes_startup_notify.py

        - name: Start Supabase memory sidecar
          env:
            SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
            SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
            GITHUB_RUN_ID:        ${{ github.run_id }}
          run: |
            nohup python3 scripts/hermes_sidecar.py > /tmp/hermes-sidecar.log 2>&1 &
            echo "SIDECAR_PID=$!" >> $GITHUB_ENV
            echo "Sidecar started"

        - name: Keep agent alive (rotation loop)
          env:
            TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
            TELEGRAM_USER_ID:     ${{ secrets.TELEGRAM_USER_ID }}
            SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
            SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
            GITHUB_TOKEN:         ${{ secrets.GH_PAT }}
            GITHUB_REPO:          ${{ github.repository }}
            GITHUB_RUN_ID:        ${{ github.run_id }}
          run: |
            TIMEOUT=13500; ELAPSED=0; INTERVAL=30
            echo "Rotation loop started — running for ${TIMEOUT}s"
            while [ $ELAPSED -lt $TIMEOUT ]; do
              sleep $INTERVAL; ELAPSED=$((ELAPSED+INTERVAL))
              if ! kill -0 $HERMES_PID 2>/dev/null; then
                echo "WARN: Hermes died at ${ELAPSED}s, restarting..."
                nohup hermes start --no-interactive --telegram --config ~/.hermes/config.yaml >> /tmp/hermes.log 2>&1 &
                HERMES_PID=$!; echo "Restarted PID=$HERMES_PID"; sleep 5
              fi
              if [ $((ELAPSED % 300)) -eq 0 ]; then
                python3 scripts/hermes_sidecar.py --flush-memory 2>/dev/null || true
                echo "Memory flushed at ${ELAPSED}s"
              fi
              if [ $((ELAPSED % 600)) -eq 0 ]; then
                echo "--- Status at ${ELAPSED}s ---"; tail -3 /tmp/hermes.log 2>/dev/null || true
              fi
            done
            echo "Rotation timeout — preparing shutdown"

        - name: Save memory before shutdown
          if: always()
          env:
            SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
            SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
            GITHUB_RUN_ID:        ${{ github.run_id }}
          run: |
            python3 scripts/hermes_sidecar.py --flush-memory 2>/dev/null || true
            echo "Memory saved"; ls -la ~/.hermes/memories/ 2>/dev/null || true

        - name: Stop Hermes gracefully
          if: always()
          run: |
            kill -TERM $HERMES_PID 2>/dev/null || true; sleep 5
            kill -9 $HERMES_PID 2>/dev/null || true; echo "Hermes stopped"

        - name: Send rotation notification
          if: always()
          env:
            TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
            TELEGRAM_USER_ID:   ${{ secrets.TELEGRAM_USER_ID }}
            GITHUB_RUN_ID:      ${{ github.run_id }}
          run: |
            curl -sf -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="$TELEGRAM_USER_ID" \
              -d text="🔄 Zypher rotating (Run #${GITHUB_RUN_ID}) — restarting soon. Memory saved." || true

        - name: Upload memory artifact
          if: always()
          uses: actions/upload-artifact@v4
          with:
            name: zypher-hermes-memory
            path: |
              ~/.hermes/memories/MEMORY.md
              ~/.hermes/memories/USER.md
            retention-days: 90
            if-no-files-found: warn

        - name: Trigger next workflow run
          if: always()
          env:
            GITHUB_TOKEN: ${{ secrets.GH_PAT }}
            GITHUB_REPO:  ${{ github.repository }}
          run: |
            curl -sf -X POST \
              -H "Authorization: token $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/$GITHUB_REPO/actions/workflows/hermes.yml/dispatches" \
              -d '{"ref":"main"}' && echo "Next run triggered" || echo "WARN: trigger failed"
  