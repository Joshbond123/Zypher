name: Zypher Hermes Agent

on:
  workflow_dispatch:
    inputs:
      instance_number:
        description: 'Instance number for tracking'
        required: false
        default: '1'
      reset_memory:
        description: 'Reset all memory'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
  schedule:
    - cron: '0 */4 * * *'

concurrency:
  group: zypher-singleton
  cancel-in-progress: true

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 235
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore memory artifact
        uses: actions/download-artifact@v4
        with:
          name: zypher-hermes-memory
          path: /tmp/memory-restore
        continue-on-error: true

      - name: Cancel other in-progress runs
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          THIS_RUN: ${{ github.run_id }}
          REPO:     ${{ github.repository }}
        run: |
          RUNS=$(curl -sf -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github.v3+json" "https://api.github.com/repos/$REPO/actions/runs?status=in_progress&per_page=20" | jq -r --arg T "$THIS_RUN" '.workflow_runs[]|select(.id|tostring!=$T)|.id' 2>/dev/null || true)
          for RID in $RUNS; do
            curl -sf -X POST -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github.v3+json" "https://api.github.com/repos/$REPO/actions/runs/$RID/cancel" && echo "Cancelled $RID" || true
          done
          echo "Cancel step done"

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends nmap nikto sqlmap gobuster hydra netcat-openbsd masscan curl wget git jq openssl net-tools whois dnsutils dirb wfuzz ripgrep ffmpeg python3-pip 2>/dev/null || true
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb -O /tmp/chrome.deb && (sudo apt-get install -y /tmp/chrome.deb 2>/dev/null || sudo dpkg -i /tmp/chrome.deb && sudo apt-get -f install -y) || true
          pip install playwright -q && python -m playwright install chromium --with-deps 2>/dev/null || true

      - name: Validate secrets
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CEREBRAS_API_KEY:   ${{ secrets.CEREBRAS_KEY_1 }}
        run: |
          [ -z "$TELEGRAM_BOT_TOKEN" ] && echo 'ERROR: TELEGRAM_BOT_TOKEN not set' && exit 1 || true
          [ -z "$CEREBRAS_API_KEY" ] && echo 'ERROR: CEREBRAS_KEY_1 not set' && exit 1 || true
          echo 'Secrets OK'

      - name: Validate Telegram token
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          RESP=$(curl -sf "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getMe")
          echo "$RESP" | grep -q '"ok":true' && echo 'Telegram OK' || { echo 'ERROR: invalid token'; exit 1; }

      - name: Install Hermes Agent
        run: pip install hermes-agent --upgrade -q

      - name: Configure Hermes
        run: mkdir -p ~/.hermes/memories ~/.hermes/workspace ~/.hermes/skills

      - name: Write Hermes config.yaml
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_USER_ID:   ${{ secrets.TELEGRAM_USER_ID }}
          CEREBRAS_API_KEY:   ${{ secrets.CEREBRAS_KEY_1 }}
        run: |
          python3 scripts/hermes_setup.py write-config
          cat ~/.hermes/config.yaml

      - name: Write Hermes .env
        env:
          TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CEREBRAS_API_KEY:     ${{ secrets.CEREBRAS_KEY_1 }}
          TAVILY_API_KEY:       ${{ secrets.TAVILY_KEY_1 }}
          TAVILY_API_KEY_2:     ${{ secrets.TAVILY_KEY_2 }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GITHUB_TOKEN:         ${{ secrets.GH_PAT }}
        run: python3 scripts/hermes_setup.py write-env

      - name: Cerebras key rotation
        env:
          CEREBRAS_API_KEY:   ${{ secrets.CEREBRAS_KEY_1 }}
          CEREBRAS_API_KEY_2: ${{ secrets.CEREBRAS_KEY_2 }}
          CEREBRAS_API_KEY_3: ${{ secrets.CEREBRAS_KEY_3 }}
          CEREBRAS_API_KEY_4: ${{ secrets.CEREBRAS_KEY_4 }}
          GITHUB_RUN_ID:      ${{ github.run_id }}
        run: python3 scripts/hermes_key_rotator.py

      - name: Cerebras preflight
        env:
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_KEY_1 }}
        run: python3 scripts/hermes_provider_preflight.py

      - name: Bootstrap memory
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GITHUB_RUN_ID:        ${{ github.run_id }}
        run: |
          mkdir -p ~/.hermes/memories
          [ -f /tmp/memory-restore/MEMORY.md ] && cp /tmp/memory-restore/MEMORY.md ~/.hermes/memories/ || true
          [ -f /tmp/memory-restore/USER.md ] && cp /tmp/memory-restore/USER.md ~/.hermes/memories/ || true
          python3 scripts/hermes_bootstrap_memory.py || true
          cp AGENTS.md ~/.hermes/AGENTS.md && echo 'AGENTS.md installed'

      - name: Reset memory (if requested)
        if: ${{ github.event.inputs.reset_memory == 'true' }}
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          rm -f ~/.hermes/memories/MEMORY.md ~/.hermes/memories/USER.md
          python3 scripts/clear_memory.py || true

      - name: Ensure Supabase schema
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GITHUB_RUN_ID:        ${{ github.run_id }}
        run: python3 scripts/setup_schema.py || true

      - name: Start Hermes agent
        env:
          TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CEREBRAS_API_KEY:     ${{ secrets.CEREBRAS_KEY_1 }}
          TAVILY_API_KEY:       ${{ secrets.TAVILY_KEY_1 }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GITHUB_RUN_ID:        ${{ github.run_id }}
        run: |
          nohup hermes start --no-interactive --telegram --config ~/.hermes/config.yaml > /tmp/hermes.log 2>&1 &
          HERMES_PID=$!
          echo "HERMES_PID=$HERMES_PID" >> $GITHUB_ENV
          echo "Hermes started with PID=$HERMES_PID"
          sleep 30
          head -50 /tmp/hermes.log || true

      - name: Send startup notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_USER_ID:   ${{ secrets.TELEGRAM_USER_ID }}
          GITHUB_RUN_ID:      ${{ github.run_id }}
        run: python3 scripts/hermes_startup_notify.py

      - name: Start Supabase sidecar
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GITHUB_RUN_ID:        ${{ github.run_id }}
        run: |
          nohup python3 scripts/hermes_sidecar.py > /tmp/hermes-sidecar.log 2>&1 &
          echo "SIDECAR_PID=$!" >> $GITHUB_ENV
          echo 'Sidecar started'

      - name: Keep agent alive (rotation loop)
        env:
          TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_USER_ID:     ${{ secrets.TELEGRAM_USER_ID }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GITHUB_TOKEN:         ${{ secrets.GH_PAT }}
          GITHUB_REPO:          ${{ github.repository }}
          GITHUB_RUN_ID:        ${{ github.run_id }}
        run: |
          TIMEOUT=13500; ELAPSED=0; INTERVAL=30
          echo "Rotation loop: ${TIMEOUT}s"
          while [ $ELAPSED -lt $TIMEOUT ]; do
            sleep $INTERVAL
            ELAPSED=$((ELAPSED+INTERVAL))
            kill -0 $HERMES_PID 2>/dev/null || { nohup hermes start --no-interactive --telegram --config ~/.hermes/config.yaml >> /tmp/hermes.log 2>&1 & HERMES_PID=$!; echo "Restarted at ${ELAPSED}s"; sleep 5; }
            [ $((ELAPSED % 300)) -eq 0 ] && { python3 scripts/hermes_sidecar.py --flush-memory 2>/dev/null || true; echo "Flush at ${ELAPSED}s"; } || true
            [ $((ELAPSED % 600)) -eq 0 ] && tail -3 /tmp/hermes.log 2>/dev/null || true
          done
          echo 'Rotation complete'

      - name: Save memory
        if: always()
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GITHUB_RUN_ID:        ${{ github.run_id }}
        run: python3 scripts/hermes_sidecar.py --flush-memory 2>/dev/null || true

      - name: Stop Hermes
        if: always()
        run: kill -TERM $HERMES_PID 2>/dev/null || true

      - name: Send rotation notification
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_USER_ID:   ${{ secrets.TELEGRAM_USER_ID }}
          GITHUB_RUN_ID:      ${{ github.run_id }}
        run: curl -sf -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" -d "chat_id=${TELEGRAM_USER_ID}" -d "text=Zypher rotating (Run #${GITHUB_RUN_ID}). Memory saved." || true

      - name: Upload memory artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zypher-hermes-memory
          path: |
            ~/.hermes/memories/MEMORY.md
            ~/.hermes/memories/USER.md
          retention-days: 90
          if-no-files-found: warn

      - name: Trigger next run
        if: always()
        env:
          GH_TOKEN:   ${{ secrets.GH_PAT }}
          REPO:       ${{ github.repository }}
        run: curl -sf -X POST -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github.v3+json" "https://api.github.com/repos/$REPO/actions/workflows/hermes.yml/dispatches" -d '{"ref":"main"}' && echo 'Next run triggered' || echo 'WARN: trigger failed'