name: Zypher Hermes Agent

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "frontend/**"
  workflow_dispatch:
    inputs:
      instance_number:
        description: 'Instance number'
        required: false
        default: '1'
      reset_memory:
        description: 'Reset memory'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
  schedule:
    - cron: '0 */4 * * *'

concurrency:
  group: zypher-singleton

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      QWEN_MODEL_REPO: LEONW24/Qwen3.5-9B-Uncensored
      QWEN_MODEL_FILE: Qwen3.5-9B-Uncensored-Q4_K_M.gguf
      HERMES_MODEL_NAME: Qwen3.5-9B-Uncensored-Q4_K_M
      LOCAL_MODEL_PORT: "7860"
      LOCAL_CTX_SIZE: "65536"
      OPENAI_API_KEY: local-qwen
      OPENROUTER_API_KEY: local-qwen
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore memory artifact from previous run
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          mkdir -p /tmp/memory-restore
          echo "Searching for latest zypher-hermes-memory artifact..."
          RESTORED=0
          RUN_IDS=$(gh run list \
            --workflow hermes.yml \
            --limit 20 \
            --json databaseId,conclusion \
            -q '.[] | select(.conclusion == "success" or .conclusion == "cancelled" or .conclusion == "timed_out" or .conclusion == "failure") | .databaseId' \
            2>/dev/null || echo "")
          for RUN_ID_PREV in $RUN_IDS; do
            if gh run download "$RUN_ID_PREV" \
              --name zypher-hermes-memory \
              --dir /tmp/memory-restore \
              2>/dev/null; then
              echo "Restored artifact from run $RUN_ID_PREV"
              RESTORED=1
              break
            fi
          done
          if [ "$RESTORED" -eq 0 ]; then
            echo "No prior artifact found — fresh start"
          fi
          echo "=== Restored files ==="
          find /tmp/memory-restore -type f 2>/dev/null | sort || echo "(empty)"

      - name: Cancel other in-progress runs
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          THIS_RUN: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          RUNS=$(curl -sf -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/$REPO/actions/runs?status=in_progress&per_page=20" \
            | jq -r --arg T "$THIS_RUN" '.workflow_runs[]|select(.id|tostring!=$T)|.id' 2>/dev/null || true)
          for RID in $RUNS; do
            curl -sf -X POST -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/$REPO/actions/runs/$RID/cancel" && echo "Cancelled $RID" || true
          done
          echo "Cancel step done"

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            nmap nikto sqlmap gobuster hydra netcat-openbsd masscan curl wget git jq \
            openssl net-tools whois dnsutils dirb wfuzz ripgrep ffmpeg python3-pip ca-certificates \
            2>/dev/null || true
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb -O /tmp/chrome.deb
          sudo apt-get install -y /tmp/chrome.deb 2>/dev/null \
            || (sudo dpkg -i /tmp/chrome.deb && sudo apt-get -f install -y) || true
          pip install playwright huggingface_hub -q
          python -m playwright install chromium --with-deps 2>/dev/null || true
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/* /tmp/chrome.deb
          df -h

      - name: Validate secrets
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          [ -z "$TELEGRAM_BOT_TOKEN" ] && echo 'ERROR: TELEGRAM_BOT_TOKEN not set' && exit 1 || true
          echo 'Secrets OK'

      - name: Validate Telegram token
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          RESP=$(curl -sf "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getMe")
          echo "$RESP" | grep -q '"ok":true' && echo 'Telegram token OK' || { echo 'ERROR: invalid token'; exit 1; }

      - name: Clear Telegram webhook (ensure polling mode)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python3 scripts/telegram_webhook_fix.py

      - name: Install Hermes Agent
        run: pip install hermes-agent --upgrade -q

      - name: Install Ollama runtime
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh | sh
          ollama --version

      - name: Download Qwen3.5 GGUF model
        run: |
          set -euo pipefail
          mkdir -p /opt/models/qwen
          hf download "$QWEN_MODEL_REPO" "$QWEN_MODEL_FILE" \
            --local-dir /opt/models/qwen
          mv "/opt/models/qwen/$QWEN_MODEL_FILE" /opt/models/qwen/model.gguf
          test -s /opt/models/qwen/model.gguf
          du -h /opt/models/qwen/model.gguf
          df -h

      - name: Start local Qwen Ollama OpenAI-compatible server
        run: |
          set -euo pipefail
          export OLLAMA_HOST="127.0.0.1:${LOCAL_MODEL_PORT}"
          export OLLAMA_MODELS="/opt/ollama-models"
          mkdir -p "$OLLAMA_MODELS"
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          OLLAMA_PID=$!
          echo "OLLAMA_PID=$OLLAMA_PID" >> $GITHUB_ENV
          echo "Ollama PID=$OLLAMA_PID"
          SERVER_READY=0
          for i in $(seq 1 90); do
            sleep 2
            if curl -sf "http://${OLLAMA_HOST}/api/version" -o /dev/null 2>/dev/null; then
              echo "Ollama ready after $((i*2))s"
              SERVER_READY=1
              break
            fi
            if ! kill -0 "$OLLAMA_PID" 2>/dev/null; then
              echo "FATAL: Ollama exited"
              cat /tmp/ollama.log || true
              exit 1
            fi
          done
          if [ "$SERVER_READY" -eq 0 ]; then
            echo "FATAL: Ollama did not become ready"
            cat /tmp/ollama.log || true
            exit 1
          fi
          {
            echo 'FROM /opt/models/qwen/model.gguf'
            echo "PARAMETER num_ctx ${LOCAL_CTX_SIZE}"
            echo 'PARAMETER temperature 0.3'
            echo 'PARAMETER top_p 0.9'
            echo 'TEMPLATE """{{- if .System }}{{ .System }}{{ end }}'
            echo '{{- range .Messages }}'
            echo '<|im_start|>{{ .Role }}'
            echo '{{ .Content }}<|im_end|>'
            echo '{{ end }}<|im_start|>assistant'
            echo '"""'
            echo 'SYSTEM "You are Zypher, a helpful Hermes AI agent."'
          } > /opt/models/qwen/Modelfile
          ollama create "$HERMES_MODEL_NAME" -f /opt/models/qwen/Modelfile
          ollama list
          curl -sf "http://${OLLAMA_HOST}/v1/models" -H "Authorization: Bearer local-qwen" | jq .
          echo "=== Ollama startup log ==="
          tail -120 /tmp/ollama.log || true

      - name: Configure Hermes directories
        run: mkdir -p ~/.hermes/memories ~/.hermes/workspace ~/.hermes/skills

      - name: Write Hermes config.yaml
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_USER_ID: ${{ secrets.TELEGRAM_USER_ID }}
        run: |
          python3 scripts/hermes_setup.py write-config
          echo "=== ~/.hermes/config.yaml ===" && cat ~/.hermes/config.yaml

      - name: Write Hermes .env
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_KEY_1 }}
          TAVILY_API_KEY_2: ${{ secrets.TAVILY_KEY_2 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          TELEGRAM_USER_ID: ${{ secrets.TELEGRAM_USER_ID }}
        run: python3 scripts/hermes_setup.py write-env

      - name: Local Qwen preflight (model validation)
        run: python3 scripts/hermes_local_model_preflight.py

      - name: Bootstrap memory and state
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p ~/.hermes/memories ~/.hermes/skills
          R="/tmp/memory-restore"
          for SRC in "$R/MEMORY.md" "$R/memories/MEMORY.md"; do
            [ -f "$SRC" ] && cp "$SRC" ~/.hermes/memories/MEMORY.md \
              && echo "restored: MEMORY.md from $SRC" && break || true
          done
          [ -f ~/.hermes/memories/MEMORY.md ] || \
            find "$R" -name "MEMORY.md" 2>/dev/null | head -1 | \
            xargs -I{} sh -c 'cp "{}" ~/.hermes/memories/MEMORY.md && echo "restored: MEMORY.md (search)"' 2>/dev/null || true
          for SRC in "$R/USER.md" "$R/memories/USER.md"; do
            [ -f "$SRC" ] && cp "$SRC" ~/.hermes/memories/USER.md \
              && echo "restored: USER.md from $SRC" && break || true
          done
          [ -f "$R/state.db" ] && cp "$R/state.db" ~/.hermes/state.db \
            && echo "restored: state.db" || echo "state.db: not in artifact"
          [ -f "$R/skills.tar.gz" ] && \
            tar xzf "$R/skills.tar.gz" -C ~/.hermes/skills/ 2>/dev/null \
            && echo "restored: skills" || true
          python3 scripts/hermes_bootstrap_memory.py || true
          if [ ! -s ~/.hermes/SOUL.md ]; then
            cp AGENTS.md ~/.hermes/SOUL.md
            echo "SOUL.md: initialized from AGENTS.md (no prior SOUL.md in artifact)"
          else
            echo "SOUL.md: retained from artifact/Supabase ($(wc -c < ~/.hermes/SOUL.md)b)"
          fi
          echo "=== Memory layout after bootstrap ==="
          find ~/.hermes -maxdepth 2 -type f | sort

      - name: Reset memory
        if: github.event.inputs.reset_memory == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          rm -f ~/.hermes/memories/MEMORY.md ~/.hermes/memories/USER.md
          python3 scripts/clear_memory.py || true

      - name: Ensure Supabase schema
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python3 scripts/setup_schema.py || true

      - name: Pre-approve bot owner (bypass pairing)
        env:
          TELEGRAM_USER_ID: ${{ secrets.TELEGRAM_USER_ID }}
        run: python3 scripts/hermes_preapprove.py

      - name: Start Hermes gateway
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_USER_ID: ${{ secrets.TELEGRAM_USER_ID }}
          TELEGRAM_ALLOWED_USERS: ${{ secrets.TELEGRAM_USER_ID }}
          TELEGRAM_HOME_CHANNEL: ${{ secrets.TELEGRAM_USER_ID }}
          TELEGRAM_HOME_CHANNEL_NAME: "Zypher Home"
          TAVILY_API_KEY: ${{ secrets.TAVILY_KEY_1 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          HERMES_YOLO_MODE: "1"
          HERMES_GATEWAY_SESSION: "1"
        run: |
          nohup hermes gateway run --accept-hooks > /tmp/hermes.log 2>&1 &
          HERMES_PID=$!
          echo "HERMES_PID=$HERMES_PID" >> $GITHUB_ENV
          echo "Hermes gateway PID=$HERMES_PID"
          sleep 35
          echo "=== Hermes startup log (first 100 lines) ==="
          head -100 /tmp/hermes.log || true

      - name: Start pairing auto-approver
        env:
          TELEGRAM_USER_ID: ${{ secrets.TELEGRAM_USER_ID }}
        run: |
          nohup python3 scripts/hermes_pairing_watcher.py > /tmp/hermes-pairing.log 2>&1 &
          echo "PAIRING_PID=$!" >> $GITHUB_ENV
          echo "Pairing watcher started"

      - name: Send startup notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_USER_ID: ${{ secrets.TELEGRAM_USER_ID }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python3 scripts/hermes_startup_notify.py

      - name: Start Supabase sidecar
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          nohup python3 scripts/hermes_sidecar.py > /tmp/hermes-sidecar.log 2>&1 &
          echo "SIDECAR_PID=$!" >> $GITHUB_ENV
          echo "Supabase sidecar started"

      - name: Keep agent alive
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_USER_ID: ${{ secrets.TELEGRAM_USER_ID }}
          TELEGRAM_ALLOWED_USERS: ${{ secrets.TELEGRAM_USER_ID }}
          TELEGRAM_HOME_CHANNEL: ${{ secrets.TELEGRAM_USER_ID }}
          TELEGRAM_HOME_CHANNEL_NAME: "Zypher Home"
          TAVILY_API_KEY: ${{ secrets.TAVILY_KEY_1 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          HERMES_YOLO_MODE: "1"
          HERMES_GATEWAY_SESSION: "1"
        run: |
          TIMEOUT=12000
          ELAPSED=0
          INTERVAL=20
          STALE_THRESHOLD=360
          WATCHDOG_RESTARTS=0
          echo "Keep-alive: ${TIMEOUT}s total | interval=${INTERVAL}s | stale_threshold=${STALE_THRESHOLD}s"

          restart_ollama() {
            echo "Restarting local Qwen Ollama server..."
            kill -KILL ${OLLAMA_PID:-0} 2>/dev/null || true
            pkill -KILL -f "[o]llama serve" 2>/dev/null || true
            sleep 2
            export OLLAMA_HOST="127.0.0.1:${LOCAL_MODEL_PORT}"
            export OLLAMA_MODELS="/opt/ollama-models"
            nohup ollama serve >> /tmp/ollama.log 2>&1 &
            OLLAMA_PID=$!
            echo "OLLAMA_PID=$OLLAMA_PID" >> $GITHUB_ENV
            for i in $(seq 1 90); do
              sleep 2
              curl -sf "http://${OLLAMA_HOST}/v1/models" \
                -H "Authorization: Bearer local-qwen" -o /dev/null 2>/dev/null \
                && echo "Ollama back after $((i*2))s" && return 0
            done
            echo "FATAL: Ollama failed to restart"
            return 1
          }

          while [ $ELAPSED -lt $TIMEOUT ]; do
            sleep $INTERVAL
            ELAPSED=$((ELAPSED+INTERVAL))

            if ! kill -0 $OLLAMA_PID 2>/dev/null; then
              echo "[${ELAPSED}s] Ollama died — restarting..."
              restart_ollama || true
            fi

            if ! kill -0 $HERMES_PID 2>/dev/null; then
              echo "[${ELAPSED}s] Hermes crashed — restarting..."
              python3 scripts/hermes_preapprove.py 2>/dev/null || true
              nohup hermes gateway run --accept-hooks >> /tmp/hermes.log 2>&1 &
              HERMES_PID=$!
              echo "HERMES_PID=$HERMES_PID" >> $GITHUB_ENV
              echo "[${ELAPSED}s] Hermes restarted PID=$HERMES_PID"
              sleep 10
            fi

            if kill -0 "$HERMES_PID" 2>/dev/null; then
              LOG_MTIME=$(date -r /tmp/hermes.log +%s 2>/dev/null || echo 0)
              if [ "$LOG_MTIME" -gt 0 ]; then
                LOG_AGE=$(( $(date +%s) - LOG_MTIME ))
                if [ "$LOG_AGE" -gt "$STALE_THRESHOLD" ]; then
                  WATCHDOG_RESTARTS=$((WATCHDOG_RESTARTS+1))
                  echo "[${ELAPSED}s] WATCHDOG #${WATCHDOG_RESTARTS}: Hermes frozen — log silent ${LOG_AGE}s > ${STALE_THRESHOLD}s"
                  curl -sf -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                    -d "chat_id=${TELEGRAM_USER_ID}" \
                    -d "text=Watchdog #${WATCHDOG_RESTARTS}: Zypher frozen (${LOG_AGE}s silence). Auto-restarting with local Qwen." 2>/dev/null || true
                  kill -KILL $HERMES_PID 2>/dev/null || true
                  pkill -KILL -f "hermes gateway run" 2>/dev/null || true
                  restart_ollama || true
                  python3 scripts/hermes_preapprove.py 2>/dev/null || true
                  nohup hermes gateway run --accept-hooks >> /tmp/hermes.log 2>&1 &
                  HERMES_PID=$!
                  echo "HERMES_PID=$HERMES_PID" >> $GITHUB_ENV
                  echo "[${ELAPSED}s] WATCHDOG: Hermes restarted PID=$HERMES_PID"
                  sleep 20
                fi
              fi
            fi

            if ! kill -0 $PAIRING_PID 2>/dev/null; then
              nohup python3 scripts/hermes_pairing_watcher.py >> /tmp/hermes-pairing.log 2>&1 &
              PAIRING_PID=$!
              echo "PAIRING_PID=$PAIRING_PID" >> $GITHUB_ENV
            fi

            if ! kill -0 $SIDECAR_PID 2>/dev/null; then
              echo "[${ELAPSED}s] Sidecar died — restarting..."
              nohup python3 scripts/hermes_sidecar.py >> /tmp/hermes-sidecar.log 2>&1 &
              SIDECAR_PID=$!
              echo "SIDECAR_PID=$SIDECAR_PID" >> $GITHUB_ENV
            fi

            [ $((ELAPSED % 300)) -eq 0 ] && {
              python3 scripts/hermes_sidecar.py --flush-memory 2>/dev/null || true
              echo "[${ELAPSED}s] Memory + state.db flushed to Supabase"
            } || true

            [ $((ELAPSED % 600)) -eq 0 ] && {
              echo "=== hermes.log tail ===" && tail -5 /tmp/hermes.log 2>/dev/null || true
              echo "=== ollama.log tail ===" && tail -8 /tmp/ollama.log 2>/dev/null || true
              echo "[${ELAPSED}s] Watchdog restarts this session: ${WATCHDOG_RESTARTS}"
            } || true
          done
          echo "Session rotation complete (watchdog_restarts=${WATCHDOG_RESTARTS})"

      - name: Stop all processes
        if: always()
        run: |
          kill -TERM ${HERMES_PID:-0}  2>/dev/null || true
          kill -TERM ${OLLAMA_PID:-0}   2>/dev/null || true
          kill -TERM ${PAIRING_PID:-0} 2>/dev/null || true
          kill -TERM ${SIDECAR_PID:-0} 2>/dev/null || true
          pkill -TERM -f "hermes gateway run"        2>/dev/null || true
          pkill -TERM -f "[o]llama serve"  2>/dev/null || true
          pkill -TERM -f "hermes_pairing_watcher.py" 2>/dev/null || true
          pkill -TERM -f "hermes_sidecar.py"         2>/dev/null || true
          for i in $(seq 1 20); do
            sleep 1
            { kill -0 ${HERMES_PID:-0} 2>/dev/null || pgrep -f "hermes gateway run" > /dev/null 2>&1; } \
              || { echo "Hermes exited after ${i}s"; break; }
          done
          kill -KILL ${HERMES_PID:-0} 2>/dev/null || true
          kill -KILL ${OLLAMA_PID:-0} 2>/dev/null || true
          pkill -KILL -f "hermes gateway run"       2>/dev/null || true
          pkill -KILL -f "[o]llama serve" 2>/dev/null || true
          echo "Process cleanup complete"

      - name: Save memory and state (final WAL-safe flush to Supabase)
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python3 scripts/hermes_sidecar.py --flush-memory 2>/dev/null || true

      - name: Send rotation notification
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_USER_ID: ${{ secrets.TELEGRAM_USER_ID }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          curl -sf -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_USER_ID}" \
            -d "text=Zypher session rotating. Run #${GITHUB_RUN_ID} ended. Next scheduled run will start automatically with local Qwen3.5-9B GGUF." || true

      - name: Stage memory artifact
        if: always()
        run: python3 scripts/hermes_stage_artifact.py

      - name: Upload memory artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zypher-hermes-memory
          path: /tmp/hermes-artifact/*
          retention-days: 7
