<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Zypher</title>
  <script>
    // SPA redirect: preserve the path, query, and hash when GitHub Pages returns 404
    // Encodes the full path into the query string so index.html can restore it
    var segmentsToKeep = 1; // 1 = keep /Zypher/ prefix
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + segmentsToKeep).join('/') + '/?p=/' +
      l.pathname.slice(1).split('/').slice(segmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body></body>
</html>
