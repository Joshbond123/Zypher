<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/Zypher/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zypher — OpenClaw AI Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <meta name="description" content="Zypher — Elite AI hacking and research platform powered by OpenClaw on Kali Linux" />
    <!-- SPA routing fix for GitHub Pages -->
    <script>
      (function(l) {
        if (l.search[1] === 'p' || l.search.indexOf('?p=/') !== -1) {
          var r = l.search.slice(1).split('&');
          var path = '';
          var query = '';
          r.forEach(function(part) {
            if (part.startsWith('p=')) path = part.slice(2);
            if (part.startsWith('q=')) query = '?' + part.slice(2).replace(/~and~/g, '&');
          });
          if (path) {
            window.history.replaceState(
              null, null,
              l.pathname.replace(/\/?$/, '') + '/' + path.replace(/^\//, '') + query + l.hash
            );
          }
        }
      }(window.location));
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
